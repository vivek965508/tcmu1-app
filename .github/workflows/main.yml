                        ),
                      ),
                    ],
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () {
                        final int x = (int.tryParse(customCtrl.text) ?? 2).clamp(1, 47);
                        Navigator.pop(ctx);
                        _sendCommandWith15sRetry(
                          cmd: '3*$x',
                          cmdType: 'START',
                          modeLabel: 'Timer 3*$x (${x * 30}m)',
                          timerMinutes: x * 30,
                        );
                      },
                      child: const Text('Start Custom Timer'),
                    ),
                  ],
                ),
              );
            }

            // ===================================================================
            // TAB 2: SEPARATE ACCOUNT / HISAB SCREEN (With Trigger Source Note)
            // ===================================================================
            Widget _buildAccountHisabScreen() {
              double paidTotal = 0;
              double pendingTotal = 0;
              for (final s in _sessions) {
                final double b = (s['finalBill'] as num?)?.toDouble() ?? 0.0;
                if (s['isPaid'] == true) {
                  paidTotal += b;
                } else {
                  pendingTotal += b;
                }
              }

              return Column(
                children: [
                  Container(
                    color: Colors.white,
                    padding: const EdgeInsets.all(12),
                    child: Column(
                      children: [
                        Row(
                          children: [
                            Expanded(
                              child: Container(
                                padding: const EdgeInsets.all(10),
                                decoration: BoxDecoration(color: const Color(0xFFDCFCE7), borderRadius: BorderRadius.circular(10)),
                                child: Column(
                                  children: [
                                    const Text('Paid (नकद प्राप्त)', style: TextStyle(fontSize: 11, color: Color(0xFF166534))),
                                    Text('₹${paidTotal.toStringAsFixed(0)}',
                                        style: const TextStyle(fontSize: 18, fontWeight: FontWeight.w900, color: Color(0xFF15803D))),
                                  ],
                                ),
                              ),
                            ),
                            const SizedBox(width: 8),
                            Expanded(
                              child: Container(
                                padding: const EdgeInsets.all(10),
                                decoration: BoxDecoration(color: const Color(0xFFFEF3C7), borderRadius: BorderRadius.circular(10)),
                                child: Column(
                                  children: [
                                    const Text('Udhaar / Pending (बाकी)', style: TextStyle(fontSize: 11, color: Color(0xFF92400E))),
                                    Text('₹${pendingTotal.toStringAsFixed(0)}',
                                        style: const TextStyle(fontSize: 18, fontWeight: FontWeight.w900, color: Color(0xFFB45309))),
                                  ],
                                ),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 8),
                        SizedBox(
                          width: double.infinity,
                          child: OutlinedButton.icon(
                            icon: const Icon(Icons.sync, size: 16),
                            label: const Text('Sync All SMS & Multi-Phone Earliest Timestamps', style: TextStyle(fontSize: 12)),
                            onPressed: () => _drainBgQueueAndSyncInbox(silent: false),
                          ),
                        ),
                      ],
                    ),
                  ),
                  const Divider(height: 1),
                  Expanded(
                    child: _sessions.isEmpty
                        ? const Center(
                            child: Padding(
                              padding: EdgeInsets.all(24),
                              child: Text(
                                'Abhi koi hisab session nahi hai.\nJab motor chalegi aur band hogi (ya aap upar Sync dabayenge), toh har session aur uska Start Source (Reply vs SMS Sent Time) yahan dikhega.',
                                textAlign: TextAlign.center,
                                style: TextStyle(color: Colors.black54),
                              ),
                            ),
                          )
                        : ListView.builder(
                            padding: const EdgeInsets.all(12),
                            itemCount: _sessions.length,
                            itemBuilder: (ctx, idx) {
                              final s = _sessions[idx];
                              final bool needsSetup = s['needsSetup'] == true;
                              final bool isPaid = s['isPaid'] == true;
                              final double bill = (s['finalBill'] as num?)?.toDouble() ?? 0.0;
                              final String sourceNote = s['triggerSource']?.toString() ?? 'Verified';

                              return Card(
                                elevation: 1,
                                color: Colors.white,
                                margin: const EdgeInsets.only(bottom: 10),
                                shape: RoundedRectangleBorder(
                                  borderRadius: BorderRadius.circular(12),
                                  side: BorderSide(
                                    color: needsSetup ? Colors.orange.shade400 : Colors.grey.shade300,
                                    width: needsSetup ? 1.5 : 1,
                                  ),
                                ),
                                child: ListTile(
                                  onTap: () => _openSessionCashMemoDialog(idx),
                                  title: Row(
                                    mainAxisAlignment: MainAxisAlignment.spaceBetween,
                                    children: [
                                      Expanded(
                                        child: Text(
                                          s['customer'] ?? 'Customer',
                                          style: TextStyle(
                                            fontWeight: FontWeight.bold,
                                            color: needsSetup ? Colors.orange.shade900 : Colors.black87,
                                          ),
                                        ),
                                      ),
                                      Text(
                                        '₹${bill.toStringAsFixed(2)}',
                                        style: const TextStyle(fontWeight: FontWeight.w900, fontSize: 16, color: Color(0xFF0284C7)),
                                      ),
                                    ],
                                  ),
                                  subtitle: Column(
                                    crossAxisAlignment: CrossAxisAlignment.start,
                                    children: [
                                      const SizedBox(height: 4),
                                      Text('📅 ${s['date']}  •  ⏱️ Run: ${_hms(s['runSec'] ?? 0)} (Cut: ${_hms(s['cutSec'] ?? 0)})',
                                          style: const TextStyle(fontSize: 12, color: Colors.black87)),
                                      const SizedBox(height: 3),
                                      Text(sourceNote,
                                          style: TextStyle(
                                            fontSize: 11,
                                            fontWeight: FontWeight.w600,
                                            color: sourceNote.contains('⚠️') ? Colors.deepOrange.shade800 : Colors.teal.shade800,
                                          )),
                                      const SizedBox(height: 4),
                                      Row(
                                        children: [
                                          Container(
                                            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                            decoration: BoxDecoration(
                                              color: isPaid ? Colors.green.shade100 : Colors.amber.shade100,
                                              borderRadius: BorderRadius.circular(10),
                                            ),
                                            child: Text(
                                              isPaid ? 'PAID' : 'UDHAAR',
                                              style: TextStyle(
                                                fontSize: 10,
                                                fontWeight: FontWeight.bold,
                                                color: isPaid ? Colors.green.shade900 : Colors.amber.shade900,
                                              ),
                                            ),
                                          ),
                                          const SizedBox(width: 8),
                                          Text('Rate: ₹${(s['rate'] as num?)?.toStringAsFixed(0) ?? _stickyRate.toStringAsFixed(0)}/hr',
                                              style: const TextStyle(fontSize: 11, color: Colors.black54)),
                                          const Spacer(),
                                          const Text('Tap for Cash Memo ➔',
                                              style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: Color(0xFF0284C7))),
                                        ],
                                      ),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                  ),
                ],
              );
            }

            void _openSessionCashMemoDialog(int index) {
              final s = _sessions[index];
              final nameCtrl = TextEditingController(
                text: (s['needsSetup'] == true) ? '' : (s['customer']?.toString() ?? ''),
              );
              final rateCtrl = TextEditingController(
                text: ((s['rate'] as num?)?.toDouble() ?? _stickyRate).toStringAsFixed(0),
              );
              final manualCtrl = TextEditingController(
                text: (s['isManual'] == true) ? ((s['finalBill'] as num?)?.toStringAsFixed(0) ?? '') : '',
              );
              bool paidStatus = s['isPaid'] == true;

              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setDialogState) {
                    final int runSec = s['runSec'] ?? 0;
                    final double enteredRate = double.tryParse(rateCtrl.text.trim()) ?? _stickyRate;
                    final double autoCalculated = (runSec / 3600.0) * enteredRate;
                    final double? manualEntered = manualCtrl.text.trim().isEmpty
                        ? null
                        : double.tryParse(manualCtrl.text.trim());
                    final double finalAmount = manualEntered ?? autoCalculated;

                    return AlertDialog(
                      title: const Text('🧾 CASH MEMO', style: TextStyle(fontWeight: FontWeight.w900)),
                      content: SingleChildScrollView(
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text('Date: ${s['date']}\nRunning Time: ${_hms(runSec)} (Cut Minus: ${_hms(s['cutSec'] ?? 0)})\n${s['triggerSource'] ?? ""}',
                                style: const TextStyle(fontSize: 11, color: Colors.black54)),
                            const Divider(height: 18),
                            TextField(
                              controller: nameCtrl,
                              decoration: const InputDecoration(
                                labelText: 'Customer Name (ग्राहक का नाम)',
                                border: OutlineInputBorder(),
                                isDense: true,
                              ),
                            ),
                            const SizedBox(height: 10),
                            TextField(
                              controller: rateCtrl,
                              keyboardType: TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'Rate per Hour (₹) - Auto-saves for future',
                                border: OutlineInputBorder(),
                                isDense: true,
                              ),
                              onChanged: (_) => setDialogState(() {}),
                            ),
                            const SizedBox(height: 10),
                            TextField(
                              controller: manualCtrl,
                              keyboardType: TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'Manual Fixed Amount ₹ (Optional Override)',
                                border: OutlineInputBorder(),
                                isDense: true,
                              ),
                              onChanged: (_) => setDialogState(() {}),
                            ),
                            const SizedBox(height: 8),
                            SwitchListTile(
                              contentPadding: EdgeInsets.zero,
                              title: Text(paidStatus ? 'PAID (नकद प्राप्त)' : 'UDHAAR (बाकी)',
                                  style: TextStyle(fontWeight: FontWeight.bold, color: paidStatus ? Colors.green.shade800 : Colors.orange.shade900)),
                              value: paidStatus,
                              onChanged: (v) => setDialogState(() => paidStatus = v),
                            ),
                            Container(
                              width: double.infinity,
                              padding: const EdgeInsets.all(10),
                              decoration: BoxDecoration(color: const Color(0xFFF0FDF4), borderRadius: BorderRadius.circular(10)),
                              child: Column(
                                children: [
                                  const Text('FINAL CASH MEMO AMOUNT', style: TextStyle(fontSize: 10, fontWeight: FontWeight.bold)),
                                  Text('₹${finalAmount.toStringAsFixed(2)}',
                                      style: const TextStyle(fontSize: 24, fontWeight: FontWeight.w900, color: Color(0xFF15803D))),
                                ],
                              ),
                            ),
                          ],
                        ),
                      ),
                      actions: [
                        TextButton(
                          onPressed: () {
                            final String cname = nameCtrl.text.trim().isEmpty ? 'Customer' : nameCtrl.text.trim();
                            final String slip = '🧾 *CASH MEMO*\n'
                                '--------------------------\n'
                                'Date: ${s['date']}\n'
                                'Customer: $cname\n'
                                'Running Time: ${_hms(runSec)}\n'
                                'Power Cut Minus: ${_hms(s['cutSec'] ?? 0)}\n'
                                'Note: ${s['triggerSource'] ?? ""}\n'
                                'Rate: ₹${enteredRate.toStringAsFixed(0)}/hr\n'
                                '--------------------------\n'
                                '*TOTAL BILL: ₹${finalAmount.toStringAsFixed(2)}*\n'
                                'Status: ${paidStatus ? "PAID" : "UDHAAR"}\n'
                                '--------------------------';
                            platform.invokeMethod('shareText', {'text': slip});
                          },
                          child: const Text('📲 Share'),
                        ),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF0284C7), foregroundColor: Colors.white),
                          onPressed: () {
                            setState(() {
                              _stickyRate = enteredRate;
                              _sessions[index]['customer'] =
                                  nameCtrl.text.trim().isEmpty ? 'Walk-in Customer' : nameCtrl.text.trim();
                              _sessions[index]['needsSetup'] = false;
                              _sessions[index]['rate'] = enteredRate;
                              _sessions[index]['calcBill'] = autoCalculated;
                              _sessions[index]['finalBill'] = finalAmount;
                              _sessions[index]['isManual'] = manualEntered != null;
                              _sessions[index]['isPaid'] = paidStatus;
                            });
                            _saveState();
                            Navigator.pop(ctx);
                            _toast('Cash Memo Saved!');
                          },
                          child: const Text('Save'),
                        ),
                      ],
                    );
                  },
                ),
              );
            }

            // ===================================================================
            // TAB 3: SETTINGS & UNIVERSAL SMS CONFIG (Matches TCMU1_Config_Users_UI.png)
            // ===================================================================
            Widget _buildSettingsScreen() {
              return ListView(
                padding: const EdgeInsets.all(14),
                children: [
                  Card(
                    elevation: 2,
                    color: Colors.white,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                    child: Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('⚙️ SETTINGS & USERS', style: TextStyle(fontSize: 16, fontWeight: FontWeight.w900)),
                          const Divider(height: 20),
                          const Text('Motor SIM Number', style: TextStyle(fontSize: 13, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 6),
                          TextField(
                            controller: _simCtrl,
                            keyboardType: TextInputType.phone,
                            decoration: const InputDecoration(border: OutlineInputBorder(), isDense: true),
                            onChanged: (v) {
                              _motorSim = v.trim();
                              _saveState();
                            },
                          ),
                          const SizedBox(height: 14),
                          const Text('Manage Users (Database)', style: TextStyle(fontSize: 14, fontWeight: FontWeight.bold)),
                          const SizedBox(height: 8),
                          SizedBox(
                            width: double.infinity,
                            height: 42,
                            child: ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF2563EB), foregroundColor: Colors.white),
                              icon: const Icon(Icons.sync, size: 18),
                              label: const Text('Sync Users from Device (10*)', style: TextStyle(fontWeight: FontWeight.bold)),
                              onPressed: () => _sendCommandWith15sRetry(cmd: '10*', cmdType: 'OTHER'),
                            ),
                          ),
                          const SizedBox(height: 12),
                          for (int i = 0; i < 4; i++)
                            Padding(
                              padding: const EdgeInsets.only(bottom: 8),
                              child: Row(
                                children: [
                                  SizedBox(width: 54, child: Text('User ${i + 1}:', style: const TextStyle(fontWeight: FontWeight.bold, fontSize: 13))),
                                  Expanded(
                                    child: TextField(
                                      controller: _userCtrls[i],
                                      keyboardType: TextInputType.phone,
                                      decoration: const InputDecoration(
                                        hintText: 'Empty',
                                        border: OutlineInputBorder(),
                                        isDense: true,
                                        contentPadding: EdgeInsets.symmetric(horizontal: 10, vertical: 10),
                                      ),
                                    ),
                                  ),
                                  const SizedBox(width: 6),
                                  ElevatedButton(
                                    style: ElevatedButton.styleFrom(
                                      backgroundColor: const Color(0xFF10B981),
                                      foregroundColor: Colors.white,
                                      minimumSize: const Size(52, 38),
                                      padding: const EdgeInsets.symmetric(horizontal: 10),
                                    ),
                                    onPressed: () {
                                      final numStr = _userCtrls[i].text.trim();
                                      if (numStr.isNotEmpty) {
                                        setState(() => _users[i] = numStr);
                                        _saveState();
                                        _sendCommandWith15sRetry(cmd: '1${i + 1}*$numStr*', cmdType: 'OTHER');
                                      }
                                    },
                                    child: const Text('ADD', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                                  ),
                                  const SizedBox(width: 4),
                                  ElevatedButton(
                                    style: ElevatedButton.styleFrom(
                                      backgroundColor: const Color(0xFFEF4444),
                                      foregroundColor: Colors.white,
                                      minimumSize: const Size(52, 38),
                                      padding: const EdgeInsets.symmetric(horizontal: 10),
                                    ),
                                    onPressed: () {
                                      setState(() {
                                        _users[i] = '';
                                        _userCtrls[i].clear();
                                      });
                                      _saveState();
                                      _sendCommandWith15sRetry(cmd: '16*${i + 1}', cmdType: 'OTHER');
                                    },
                                    child: const Text('DEL', style: TextStyle(fontWeight: FontWeight.bold, fontSize: 12)),
                                  ),
                                ],
                              ),
                            ),
                          const SizedBox(height: 8),
                          SizedBox(
                            width: double.infinity,
                            height: 42,
                            child: ElevatedButton(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFFB91C1C), foregroundColor: Colors.white),
                              onPressed: () {
                                setState(() {
                                  for (int i = 0; i < 4; i++) {
                                    _users[i] = '';
                                    _userCtrls[i].clear();
                                  }
                                });
                                _saveState();
                                _sendCommandWith15sRetry(cmd: '16*1234', cmdType: 'OTHER');
                              },
                              child: const Text('RESET ALL USERS (16*1234)', style: TextStyle(fontWeight: FontWeight.bold)),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                  const SizedBox(height: 14),
                  Card(
                    elevation: 2,
                    color: Colors.white,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                    child: Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('🛠️ UNIVERSAL SMS CONFIG', style: TextStyle(fontSize: 16, fontWeight: FontWeight.w900)),
                          const Divider(height: 20),
                          Row(
                            children: [
                              SizedBox(width: 85, child: TextField(controller: _cmdStartCtrl, decoration: const InputDecoration(labelText: 'Start Cmd', border: OutlineInputBorder(), isDense: true))),
                              const SizedBox(width: 8),
                              Expanded(child: TextField(controller: _repStartCtrl, decoration: const InputDecoration(labelText: 'Start Reply', border: OutlineInputBorder(), isDense: true))),
                            ],
                          ),
                          const SizedBox(height: 10),
                          Row(
                            children: [
                              SizedBox(width: 85, child: TextField(controller: _cmdStopCtrl, decoration: const InputDecoration(labelText: 'Stop Cmd', border: OutlineInputBorder(), isDense: true))),
                              const SizedBox(width: 8),
                              Expanded(child: TextField(controller: _repStopCtrl, decoration: const InputDecoration(labelText: 'Stop Reply', border: OutlineInputBorder(), isDense: true))),
                            ],
                          ),
                          const SizedBox(height: 10),
                          TextField(controller: _repCutCtrl, decoration: const InputDecoration(labelText: 'Power Cut Reply', border: OutlineInputBorder(), isDense: true)),
                          const SizedBox(height: 10),
                          TextField(controller: _repResCtrl, decoration: const InputDecoration(labelText: 'Power Resume Reply', border: OutlineInputBorder(), isDense: true)),
                          const SizedBox(height: 10),
                          TextField(controller: _repPhysOnCtrl, decoration: const InputDecoration(labelText: 'Physical Start Reply', border: OutlineInputBorder(), isDense: true)),
                          const SizedBox(height: 10),
                          TextField(controller: _repPhysOffCtrl, decoration: const InputDecoration(labelText: 'Physical Stop Reply', border: OutlineInputBorder(), isDense: true)),
                          const SizedBox(height: 10),
                          Row(
                            children: [
                              Expanded(child: TextField(controller: _repTimerOnCtrl, decoration: const InputDecoration(labelText: 'Timer (3*X) Start Reply', border: OutlineInputBorder(), isDense: true))),
                              const SizedBox(width: 8),
                              Expanded(child: TextField(controller: _repTimerOffCtrl, decoration: const InputDecoration(labelText: 'Timer (3*X) End Reply', border: OutlineInputBorder(), isDense: true))),
                            ],
                          ),
                          const SizedBox(height: 14),
                          SizedBox(
                            width: double.infinity,
                            height: 46,
                            child: ElevatedButton.icon(
                              style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF10B981), foregroundColor: Colors.white),
                              icon: const Icon(Icons.save),
                              label: const Text('SAVE CONFIGURATION', style: TextStyle(fontWeight: FontWeight.bold)),
                              onPressed: () {
                                setState(() {
                                  _motorSim = _simCtrl.text.trim();
                                  _cmdStart = _cmdStartCtrl.text.trim();
                                  _replyStart = _repStartCtrl.text.trim();
                                  _cmdStop = _cmdStopCtrl.text.trim();
                                  _replyStop = _repStopCtrl.text.trim();
                                  _replyPowerCut = _repCutCtrl.text.trim();
                                  _replyPowerResume = _repResCtrl.text.trim();
                                  _replyPhysStart = _repPhysOnCtrl.text.trim();
                                  _replyPhysStop = _repPhysOffCtrl.text.trim();
                                  _replyTimerStart = _repTimerOnCtrl.text.trim();
                                  _replyTimerEnd = _repTimerOffCtrl.text.trim();
                                });
                                _saveState();
                                _toast('Configuration Saved!');
                              },
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ],
              );
            }
          }
          DARTEOF

          flutter build apk --release

