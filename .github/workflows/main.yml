              final c = TextEditingController(text: _users[slot - 1]);
              showDialog(
                context: context,
                builder: (ctx) => AlertDialog(
                  title: Text('Set USER $slot (1$slot*<mobile>*)'),
                  content: TextField(
                    controller: c,
                    keyboardType: TextInputType.phone,
                    decoration: const InputDecoration(labelText: '10-Digit Mobile Number'),
                  ),
                  actions: [
                    TextButton(onPressed: () => Navigator.pop(ctx), child: const Text('Cancel')),
                    ElevatedButton(
                      onPressed: () {
                        final numStr = c.text.trim();
                        if (numStr.isNotEmpty) {
                          setState(() => _users[slot - 1] = numStr);
                          _saveLocalState();
                          _sendSms('1$slot*$numStr*');
                        }
                        Navigator.pop(ctx);
                      },
                      child: const Text('Save & Send SMS'),
                    ),
                  ],
                ),
              );
