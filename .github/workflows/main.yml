name: Build TCMU-1 Android APK Automatically

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Pro 3-Tab TCMU-1 App and Build APK
        run: |
          flutter create tcmu1_app --org com.tcmu1.controller --platforms=android
          cd tcmu1_app

          python3 - << 'PYEOF'
          import os

          manifest = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>

              <application
                  android:label="TCMU-1 Controller"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".SmsBgReceiver"
                      android:permission="android.permission.BROADCAST_SMS"
                      android:exported="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>'''
          open('android/app/src/main/AndroidManifest.xml', 'w').write(manifest)

          kt_dir = 'android/app/src/main/kotlin/com/tcmu1/controller'
          os.makedirs(kt_dir, exist_ok=True)

          receiver_kt = '''package com.tcmu1.controller

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.provider.Telephony
          import org.json.JSONArray
          import org.json.JSONObject

          class SmsBgReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context?, intent: Intent?) {
                  if (context == null || intent?.action != Telephony.Sms.Intents.SMS_RECEIVED_ACTION) return
                  try {
                      val msgs = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                      val sb = StringBuilder()
                      var sender = ""
                      var ts = System.currentTimeMillis()
                      for (m in msgs) {
                          sender = m.originatingAddress ?: ""
                          sb.append(m.messageBody ?: "")
                          ts = m.timestampMillis
                      }
                      val body = sb.toString()
                      val prefs = context.getSharedPreferences("tcmu1_bg_queue", Context.MODE_PRIVATE)
                      val rawArr = prefs.getString("queue", "[]") ?: "[]"
                      val arr = JSONArray(rawArr)
                      val obj = JSONObject()
                      obj.put("sender", sender)
                      obj.put("body", body)
                      obj.put("ts", ts)
                      arr.put(obj)
                      prefs.edit().putString("queue", arr.toString()).apply()

                      MainActivity.liveSink?.invoke(sender, body, ts)
                  } catch (_: Exception) {}
              }
          }
          '''
          open(os.path.join(kt_dir, 'SmsBgReceiver.kt'), 'w').write(receiver_kt)

          main_kt = '''package com.tcmu1.controller

          import android.Manifest
          import android.app.KeyguardManager
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.os.PowerManager
          import android.provider.Settings
          import android.telephony.SmsManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity: FlutterActivity() {
              companion object {
                  var liveSink: ((String, String, Long) -> Unit)? = null
              }

              private val CHANNEL = "com.tcmu1.controller/native"
              private var methodChannel: MethodChannel? = null
              private var pendingAuthResult: MethodChannel.Result? = null
              private val AUTH_REQ_CODE = 901

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)

                  liveSink = { sender, body, ts ->
                      runOnUiThread {
                          methodChannel?.invokeMethod("onSmsReceived", mapOf("sender" to sender, "body" to body, "ts" to ts))
                      }
                  }

                  methodChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "checkAndRequestPermissions" -> {
                              requestAllNeededPermissions()
                              result.success(hasSmsPermissions())
                          }
                          "hasPermissions" -> {
                              result.success(hasSmsPermissions())
                          }
                          "requestBatteryUnrestricted" -> {
                              try {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                                      if (!pm.isIgnoringBatteryOptimizations(packageName)) {
                                          val i = Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS)
                                          i.data = Uri.parse("package:$packageName")
                                          startActivity(i)
                                      }
                                  }
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "sendSms" -> {
                              val number = call.argument<String>("number") ?: ""
                              val message = call.argument<String>("message") ?: ""
                              try {
                                  if (!hasSmsPermissions()) {
                                      requestAllNeededPermissions()
                                      result.success(false)
                                  } else {
                                      val smsManager = SmsManager.getDefault()
                                      smsManager.sendTextMessage(number, null, message, null, null)
                                      result.success(true)
                                  }
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "popBackgroundSmsQueue" -> {
                              val prefs = getSharedPreferences("tcmu1_bg_queue", Context.MODE_PRIVATE)
                              val raw = prefs.getString("queue", "[]") ?: "[]"
                              prefs.edit().putString("queue", "[]").apply()
                              result.success(raw)
                          }
                          "readRecentInboxSms" -> {
                              val filterNum = call.argument<String>("motorSim") ?: ""
                              result.success(readDeviceSmsInbox(filterNum))
                          }
                          "authenticateDevice" -> {
                              try {
                                  val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP && km.isKeyguardSecure) {
                                      @Suppress("DEPRECATION")
                                      val intent = km.createConfirmDeviceCredentialIntent("Settings Lock", "Use your Phone Fingerprint, PIN, or Pattern")
                                      if (intent != null) {
                                          pendingAuthResult = result
                                          startActivityForResult(intent, AUTH_REQ_CODE)
                                      } else {
                                          result.success(true)
                                      }
                                  } else {
                                      result.success(true)
                                  }
                              } catch (e: Exception) {
                                  result.success(true)
                              }
                          }
                          "shareText" -> {
                              val text = call.argument<String>("text") ?: ""
                              val sendIntent = Intent().apply {
                                  action = Intent.ACTION_SEND
                                  putExtra(Intent.EXTRA_TEXT, text)
                                  type = "text/plain"
                              }
                              startActivity(Intent.createChooser(sendIntent, "Share Cash Memo"))
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun hasSmsPermissions(): Boolean {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return true
                  val s1 = checkSelfPermission(Manifest.permission.SEND_SMS) == PackageManager.PERMISSION_GRANTED
                  val s2 = checkSelfPermission(Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED
                  val s3 = checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED
                  return s1 && s2 && s3
              }

              private fun requestAllNeededPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      val perms = mutableListOf(
                          Manifest.permission.SEND_SMS,
                          Manifest.permission.RECEIVE_SMS,
                          Manifest.permission.READ_SMS,
                          Manifest.permission.READ_PHONE_STATE
                      )
                      if (Build.VERSION.SDK_INT >= 33) {
                          perms.add("android.permission.POST_NOTIFICATIONS")
                      }
                      requestPermissions(perms.toTypedArray(), 101)
                  }
              }

              private fun readDeviceSmsInbox(motorSim: String): String {
                  val arr = JSONArray()
                  if (!hasSmsPermissions()) return arr.toString()
                  val cleanFilter = motorSim.replace(Regex("[^0-9]"), "")
                  val last10 = if (cleanFilter.length >= 10) cleanFilter.takeLast(10) else cleanFilter
                  var cursor: Cursor? = null
                  try {
                      cursor = contentResolver.query(
                          Uri.parse("content://sms/inbox"),
                          arrayOf("address", "body", "date"),
                          null,
                          null,
                          "date ASC LIMIT 200"
                      )
                      if (cursor != null && cursor.moveToFirst()) {
                          do {
                              val addr = cursor.getString(0) ?: ""
                              val body = cursor.getString(1) ?: ""
                              val dt = cursor.getLong(2)
                              if (last10.isEmpty() || addr.contains(last10)) {
                                  val o = JSONObject()
                                  o.put("sender", addr)
                                  o.put("body", body)
                                  o.put("ts", dt)
                                  arr.put(o)
                              }
                          } while (cursor.moveToNext())
                      }
                  } catch (_: Exception) {
                  } finally {
                      cursor?.close()
                  }
                  return arr.toString()
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == AUTH_REQ_CODE) {
                      val res = pendingAuthResult
                      pendingAuthResult = null
                      res?.success(resultCode == RESULT_OK)
                  }
              }

              override fun onDestroy() {
                  liveSink = null
                  super.onDestroy()
              }
          }
          '''
          open(os.path.join(kt_dir, 'MainActivity.kt'), 'w').write(main_kt)
          PYEOF

          cat << 'DARTEOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const TcmuMasterApp());
          }

          class TcmuMasterApp extends StatelessWidget {
            const TcmuMasterApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'TCMU-1 Controller',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: const Color(0xFFF1F5F9),
                  colorSchemeSeed: const Color(0xFF0F766E),
                ),
                home: const MainHomeShell(),
              );
            }
          }

          class MainHomeShell extends StatefulWidget {
            const MainHomeShell({super.key});
            @override
            State<MainHomeShell> createState() => _MainHomeShellState();
          }

          class _MainHomeShellState extends State<MainHomeShell> with WidgetsBindingObserver {
            static const platform = MethodChannel('com.tcmu1.controller/native');

            int _currentTab = 0; // 0 = Main Control, 1 = Account/Hisab, 2 = Settings
            bool _settingsUnlocked = false;
            bool _smsPermGranted = false;

            // Radio button selections on Tab 1 (Control)
            bool _electricityAutoRestartRadio = true; // true = ON (4*1), false = OFF (4*0)
            String _selectedActionRadio = 'NORMAL_ON'; // NORMAL_ON, TIMER_ON, CONTINUE_ON, MOTOR_OFF
            int _selectedTimerUnits = 2; // 3*2 = 60 mins

            // Universal Config State
            String _motorSim = '+919876543210';
            double _stickyRate = 120.0; // Jo rate ek baar pad jaye wahi aage sab pe chale
            List<String> _users = ['8081728811', '7839455008', '', '9236504217'];

            String _cmdStart = '1*';
            String _replyStart = 'PUMP STARTED';
            String _cmdStop = '2*';
            String _replyStop = 'PUMP STOPPED';
            String _cmdAutoOn = '4*1';
            String _replyAutoOn = 'SUCCESSFULLY SET AUTO MODE';
            String _replyTimerStart = 'PUMP STARTED';
            String _replyTimerEnd = 'PUMP STOPPED';
            String _replyPowerCut = 'POWER OFF PUMP OFF';
            String _replyPowerResume = 'POWER RESUME PUMP STARTED';
            String _replyPhysStart = 'manual start';
            String _replyPhysStop = 'manual stop';

            // Live Running Session State
            String _motorState = 'STOPPED'; // STOPPED, RUNNING, PAUSED_POWER_CUT
            String _powerState = 'AVAILABLE';
            String _batteryState = 'CHARGING';
            String _signalState = '63%';
            String _activeSessionMode = 'Normal (1*)';
            DateTime? _sessionStartTime;
            int _runSec = 0;
            int _cutSec = 0;
            int _targetTimerSec = 0;
            int _cooldownSec = 0;
            int _retryCount = 0;
            Timer? _clockTimer;
            Timer? _cooldownTimer;
            Timer? _retryTimer;

            // Account / Hisab Sessions List
            List<Map<String, dynamic>> _sessions = [];

            // Controllers for Settings Tab (matches TCMU1_Config_Users_UI.png)
            final TextEditingController _simCtrl = TextEditingController(text: '+919876543210');
            late List<TextEditingController> _userCtrls;
            final TextEditingController _cmdStartCtrl = TextEditingController(text: '1*');
            final TextEditingController _repStartCtrl = TextEditingController(text: 'PUMP STARTED');
            final TextEditingController _cmdStopCtrl = TextEditingController(text: '2*');
            final TextEditingController _repStopCtrl = TextEditingController(text: 'PUMP STOPPED');
            final TextEditingController _cmdAutoCtrl = TextEditingController(text: '4*1');
            final TextEditingController _repAutoCtrl = TextEditingController(text: 'SUCCESSFULLY SET AUTO MODE');
            final TextEditingController _repCutCtrl = TextEditingController(text: 'POWER OFF PUMP OFF');
            final TextEditingController _repResCtrl = TextEditingController(text: 'POWER RESUME PUMP STARTED');
            final TextEditingController _repPhysOnCtrl = TextEditingController(text: 'manual start');
            final TextEditingController _repPhysOffCtrl = TextEditingController(text: 'manual stop');
            final TextEditingController _repTimerOnCtrl = TextEditingController(text: 'PUMP STARTED');
            final TextEditingController _repTimerOffCtrl = TextEditingController(text: 'PUMP STOPPED');

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _userCtrls = List.generate(4, (i) => TextEditingController(text: _users[i]));
              _loadSavedState().then((_) {
                _initNativePermissionsAndQueue();
              });

              platform.setMethodCallHandler((call) async {
                if (call.method == 'onSmsReceived') {
                  final map = Map<String, dynamic>.from(call.arguments);
                  _processIncomingSms(
                    map['sender']?.toString() ?? '',
                    map['body']?.toString() ?? '',
                    (map['ts'] as int?) ?? DateTime.now().millisecondsSinceEpoch,
                  );
                }
              });
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _clockTimer?.cancel();
              _cooldownTimer?.cancel();
              _retryTimer?.cancel();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _drainBackgroundQueue();
                _checkPermissionStatus();
              }
            }

            File get _storageFile => File('${Directory.systemTemp.path}/tcmu1_pro_v2.json');

            Future<void> _loadSavedState() async {
              try {
                if (await _storageFile.exists()) {
                  final data = jsonDecode(await _storageFile.readAsString());
                  setState(() {
                    _motorSim = data['motorSim'] ?? '+919876543210';
                    _simCtrl.text = _motorSim;
                    _stickyRate = (data['stickyRate'] ?? 120.0).toDouble();
                    _electricityAutoRestartRadio = data['autoMode'] ?? true;
                    _users = List<String>.from(data['users'] ?? ['8081728811', '7839455008', '', '9236504217']);
                    for (int i = 0; i < 4; i++) {
                      _userCtrls[i].text = _users[i];
                    }
                    _cmdStart = data['cmdStart'] ?? '1*';
                    _cmdStartCtrl.text = _cmdStart;
                    _replyStart = data['replyStart'] ?? 'PUMP STARTED';
                    _repStartCtrl.text = _replyStart;
                    _cmdStop = data['cmdStop'] ?? '2*';
                    _cmdStopCtrl.text = _cmdStop;
                    _replyStop = data['replyStop'] ?? 'PUMP STOPPED';
                    _repStopCtrl.text = _replyStop;
                    _cmdAutoOn = data['cmdAutoOn'] ?? '4*1';
                    _cmdAutoCtrl.text = _cmdAutoOn;
                    _replyAutoOn = data['replyAutoOn'] ?? 'SUCCESSFULLY SET AUTO MODE';
                    _repAutoCtrl.text = _replyAutoOn;
                    _replyPowerCut = data['replyPowerCut'] ?? 'POWER OFF PUMP OFF';
                    _repCutCtrl.text = _replyPowerCut;
                    _replyPowerResume = data['replyPowerResume'] ?? 'POWER RESUME PUMP STARTED';
                    _repResCtrl.text = _replyPowerResume;
                    _replyPhysStart = data['replyPhysStart'] ?? 'manual start';
                    _repPhysOnCtrl.text = _replyPhysStart;
                    _replyPhysStop = data['replyPhysStop'] ?? 'manual stop';
                    _repPhysOffCtrl.text = _replyPhysStop;
                    _replyTimerStart = data['replyTimerStart'] ?? 'PUMP STARTED';
                    _repTimerOnCtrl.text = _replyTimerStart;
                    _replyTimerEnd = data['replyTimerEnd'] ?? 'PUMP STOPPED';
                    _repTimerOffCtrl.text = _replyTimerEnd;
                    _sessions = List<Map<String, dynamic>>.from(data['sessions'] ?? []);
                  });
                }
              } catch (_) {}
            }

            Future<void> _saveState() async {
              try {
                final map = {
                  'motorSim': _motorSim,
                  'stickyRate': _stickyRate,
                  'autoMode': _electricityAutoRestartRadio,
                  'users': _users,
                  'cmdStart': _cmdStart,
                  'replyStart': _replyStart,
                  'cmdStop': _cmdStop,
                  'replyStop': _replyStop,
                  'cmdAutoOn': _cmdAutoOn,
                  'replyAutoOn': _replyAutoOn,
                  'replyPowerCut': _replyPowerCut,
                  'replyPowerResume': _replyPowerResume,
                  'replyPhysStart': _replyPhysStart,
                  'replyPhysStop': _replyPhysStop,
                  'replyTimerStart': _replyTimerStart,
                  'replyTimerEnd': _replyTimerEnd,
                  'sessions': _sessions,
                };
                await _storageFile.writeAsString(jsonEncode(map));
              } catch (_) {}
            }

            Future<void> _initNativePermissionsAndQueue() async {
              final bool granted = await platform.invokeMethod('checkAndRequestPermissions') ?? false;
              setState(() => _smsPermGranted = granted);
              await _drainBackgroundQueue();
            }

            Future<void> _checkPermissionStatus() async {
              final bool granted = await platform.invokeMethod('hasPermissions') ?? false;
              setState(() => _smsPermGranted = granted);
            }

            Future<void> _drainBackgroundQueue() async {
              try {
                final String rawJson = await platform.invokeMethod('popBackgroundSmsQueue') ?? '[]';
                final List<dynamic> list = jsonDecode(rawJson);
                for (final item in list) {
                  _processIncomingSms(
                    item['sender']?.toString() ?? '',
                    item['body']?.toString() ?? '',
                    (item['ts'] as int?) ?? DateTime.now().millisecondsSinceEpoch,
                  );
                }
              } catch (_) {}
            }

            // Read phone SMS inbox to reconstruct any missed sessions while phone/app was closed
            Future<void> _syncFromPhoneSmsInbox() async {
              try {
                final String rawJson = await platform.invokeMethod('readRecentInboxSms', {'motorSim': _motorSim}) ?? '[]';
                final List<dynamic> list = jsonDecode(rawJson);
                if (list.isEmpty) {
                  _toast('No SMS found in Inbox from $_motorSim');
                  return;
                }
                int added = 0;
                DateTime? openStart;
                DateTime? pauseStart;
                int pausedAccum = 0;
                String modeLabel = 'Inbox Synced';

                for (final item in list) {
                  final String body = (item['body']?.toString() ?? '').trim();
                  final String up = body.toUpperCase();
                  final int ts = (item['ts'] as int?) ?? 0;
                  final DateTime dt = DateTime.fromMillisecondsSinceEpoch(ts);

                  if (up.contains('TCMU-1 USERS') || up.contains('USER1')) {
                    _parseUsersFromSms(body);
                  } else if (up.contains(_replyStart.toUpperCase()) || up.contains(_replyPhysStart.toUpperCase())) {
                    openStart = dt;
                    pauseStart = null;
                    pausedAccum = 0;
                    modeLabel = up.contains(_replyPhysStart.toUpperCase()) ? 'Physical Start' : 'Normal Start';
                  } else if (up.contains(_replyPowerCut.toUpperCase()) && openStart != null) {
                    pauseStart = dt;
                  } else if (up.contains(_replyPowerResume.toUpperCase()) && openStart != null && pauseStart != null) {
                    pausedAccum += dt.difference(pauseStart).inSeconds.abs();
                    pauseStart = null;
                  } else if ((up.contains(_replyStop.toUpperCase()) || up.contains(_replyPhysStop.toUpperCase())) && openStart != null) {
                    final int totalSec = dt.difference(openStart).inSeconds.abs();
                    final int netSec = (totalSec - pausedAccum).clamp(60, 86400);
                    final String sessionId = 'INBOX_${openStart.millisecondsSinceEpoch}';
                    final bool exists = _sessions.any((s) => s['id'] == sessionId);
                    if (!exists) {
                      final double calcAmt = (netSec / 3600.0) * _stickyRate;
                      _sessions.insert(0, {
                        'id': sessionId,
                        'date': _formatDate(openStart),
                        'customer': 'Tap to Set Customer Name',
                        'needsSetup': true,
                        'mode': modeLabel,
                        'runSec': netSec,
                        'cutSec': pausedAccum,
                        'rate': _stickyRate,
                        'calcBill': calcAmt,
                        'finalBill': calcAmt,
                        'isManual': false,
                        'isPaid': false,
                      });
                      added++;
                    }
                    openStart = null;
                  }
                }
                await _saveState();
                setState(() {});
                _toast('Inbox Sync Complete! Added $added session(s).');
              } catch (e) {
                _toast('Inbox Sync Error: Check SMS Permission');
              }
            }

            void _parseUsersFromSms(String raw) {
              final List<String> parsed = ['', '', '', ''];
              for (int i = 1; i <= 4; i++) {
                final rx = RegExp(r'USER\s*' + i.toString() + r'\s*=\s*(\d{10,12})', caseSensitive: false);
                final m = rx.firstMatch(raw);
                if (m != null) parsed[i - 1] = m.group(1) ?? '';
              }
              setState(() {
                _users = parsed;
                for (int i = 0; i < 4; i++) {
                  _userCtrls[i].text = _users[i];
                }
              });
              _saveState();
            }

            void _processIncomingSms(String sender, String rawBody, int tsMillis) {
              final String body = rawBody.trim();
              final String up = body.toUpperCase();

              // 1. Users List Reply (*TCMU-1 USERS*)
              if (up.contains('TCMU-1 USERS') || up.contains('USER1')) {
                _parseUsersFromSms(body);
                _toast('Users Synced from TCMU-1 Device!');
                return;
              }

              // 2. Status Reply (**TCMU-1 STATUS**)
              if (up.contains('TCMU-1 STATUS')) {
                setState(() {
                  if (up.contains('POWER AVAILABLE')) _powerState = 'AVAILABLE';
                  if (up.contains('POWER OFF')) _powerState = 'OFF';
                  if (up.contains('CHARGING')) _batteryState = 'CHARGING';
                  final sig = RegExp(r'SIGNAL\s*:\s*(\d+%)', caseSensitive: false).firstMatch(body);
                  if (sig != null) _signalState = sig.group(1)!;
                  if (up.contains('MODE : AUTO')) _electricityAutoRestartRadio = true;
                  if (up.contains('MODE : MANUAL')) _electricityAutoRestartRadio = false;
                });
                _toast('Device Status Updated!');
                return;
              }

              // 3. Power Cut (Pause Session)
              if (_replyPowerCut.isNotEmpty && up.contains(_replyPowerCut.toUpperCase())) {
                if (_motorState == 'RUNNING') {
                  setState(() {
                    _motorState = 'PAUSED_POWER_CUT';
                    _powerState = 'POWER CUT (PAUSED)';
                  });
                  _toast('Electricity OFF! Session Timer PAUSED.');
                }
                return;
              }

              // 4. Power Resume (Resume Session)
              if (_replyPowerResume.isNotEmpty && up.contains(_replyPowerResume.toUpperCase())) {
                if (_motorState == 'PAUSED_POWER_CUT') {
                  setState(() {
                    _motorState = 'RUNNING';
                    _powerState = 'AVAILABLE';
                  });
                  _ensureTimerTicking();
                  _toast('Electricity Resumed! Session Timer RESUMED.');
                }
                return;
              }

              // 5. Physical Manual Start (Case-insensitive substring match)
              if (_replyPhysStart.isNotEmpty && up.contains(_replyPhysStart.toUpperCase())) {
                _retryTimer?.cancel();
                if (_motorState == 'STOPPED') {
                  _startSessionInternal('Physical Start (Manual)', 0);
                  _toast('Motor Started Physically! Session Recording...');
                }
                return;
              }

              // 6. Physical Manual Stop or Normal/Timer Stop
              if ((_replyPhysStop.isNotEmpty && up.contains(_replyPhysStop.toUpperCase())) ||
                  (_replyStop.isNotEmpty && up.contains(_replyStop.toUpperCase())) ||
                  (_replyTimerEnd.isNotEmpty && up.contains(_replyTimerEnd.toUpperCase()))) {
                _retryTimer?.cancel();
                if (_motorState != 'STOPPED') {
                  _finishSessionAndAddToAccount();
                  _toast('Motor Stopped! Session saved to Account tab.');
                }
                return;
              }

              // 7. Normal Start / Timer Start Reply
              if ((_replyStart.isNotEmpty && up.contains(_replyStart.toUpperCase())) ||
                  (_replyTimerStart.isNotEmpty && up.contains(_replyTimerStart.toUpperCase()))) {
                _retryTimer?.cancel();
                if (_motorState == 'STOPPED') {
                  _startSessionInternal(_activeSessionMode, 0);
                }
                _toast('Confirmed: PUMP STARTED!');
              }
            }

            Future<void> _sendSmsWithAutoRetry(String cmd, {bool expectReply = true}) async {
              if (_cooldownSec > 0) {
                _toast('Please wait $_cooldownSec sec (Anti-Spam Cooldown)');
                return;
              }
              setState(() => _cooldownSec = 30);
              _cooldownTimer?.cancel();
              _cooldownTimer = Timer.periodic(const Duration(seconds: 1), (t) {
                if (_cooldownSec <= 1) {
                  t.cancel();
                  setState(() => _cooldownSec = 0);
                } else {
                  setState(() => _cooldownSec--);
                }
              });

              final bool sent = await platform.invokeMethod('sendSms', {'number': _motorSim, 'message': cmd}) ?? false;
              if (!sent) {
                _toast('Grant SMS Permission first!');
                return;
              }
              _toast('SMS Sent: $cmd -> $_motorSim');

              if (expectReply) {
                _retryCount = 1;
                _retryTimer?.cancel();
                _retryTimer = Timer.periodic(const Duration(seconds: 25), (t) async {
                  if (_retryCount < 3) {
                    _retryCount++;
                    await platform.invokeMethod('sendSms', {'number': _motorSim, 'message': cmd});
                    _toast('Auto-Retry ($_retryCount/3): Sent $cmd');
                  } else {
                    t.cancel();
                  }
                });
              }
            }

            void _startSessionInternal(String modeLabel, int timerMins) {
              setState(() {
                _activeSessionMode = modeLabel;
                _motorState = 'RUNNING';
                _sessionStartTime = DateTime.now();
                _runSec = 0;
                _cutSec = 0;
                _targetTimerSec = timerMins * 60;
              });
              _ensureTimerTicking();
            }

            void _ensureTimerTicking() {
              _clockTimer?.cancel();
              _clockTimer = Timer.periodic(const Duration(seconds: 1), (t) {
                setState(() {
                  if (_motorState == 'RUNNING') {
                    _runSec++;
                    if (_targetTimerSec > 0 && _runSec >= _targetTimerSec) {
                      _finishSessionAndAddToAccount();
                    }
                  } else if (_motorState == 'PAUSED_POWER_CUT') {
                    _cutSec++;
                  }
                });
              });
            }

            void _finishSessionAndAddToAccount() {
              _clockTimer?.cancel();
              final int finalRunSec = _runSec > 0 ? _runSec : 60;
              final double calcAmt = double.parse(((finalRunSec / 3600.0) * _stickyRate).toStringAsFixed(2));

              final newSession = {
                'id': 'SES_${DateTime.now().millisecondsSinceEpoch}',
                'date': _formatDate(_sessionStartTime ?? DateTime.now()),
                'customer': 'Tap to Enter Customer Name',
                'needsSetup': true,
                'mode': _activeSessionMode,
                'runSec': finalRunSec,
                'cutSec': _cutSec,
                'rate': _stickyRate,
                'calcBill': calcAmt,
                'finalBill': calcAmt,
                'isManual': false,
                'isPaid': false,
              };

              setState(() {
                _motorState = 'STOPPED';
                _sessions.insert(0, newSession);
              });
              _saveState();
            }

            void _executeSelectedRadioAction() {
              if (_selectedActionRadio == 'NORMAL_ON') {
                _startSessionInternal('Normal Start (1*)', 0);
                _sendSmsWithAutoRetry(_cmdStart, expectReply: true);
              } else if (_selectedActionRadio == 'TIMER_ON') {
                final int mins = _selectedTimerUnits * 30;
                _startSessionInternal('Timer Start (3*$_selectedTimerUnits = ${mins}m)', mins);
                _sendSmsWithAutoRetry('3*$_selectedTimerUnits', expectReply: true);
              } else if (_selectedActionRadio == 'CONTINUE_ON') {
                if (_motorState == 'PAUSED_POWER_CUT') {
                  setState(() => _motorState = 'RUNNING');
                  _ensureTimerTicking();
                  _sendSmsWithAutoRetry(_cmdStart, expectReply: true);
                } else if (_sessions.isNotEmpty && _motorState == 'STOPPED') {
                  final last = _sessions.removeAt(0);
                  setState(() {
                    _activeSessionMode = 'Continued (${last['mode']})';
                    _runSec = last['runSec'] ?? 0;
                    _cutSec = last['cutSec'] ?? 0;
                    _motorState = 'RUNNING';
                  });
                  _ensureTimerTicking();
                  _sendSmsWithAutoRetry(_cmdStart, expectReply: true);
                } else {
                  _startSessionInternal('Continue Start (1*)', 0);
                  _sendSmsWithAutoRetry(_cmdStart, expectReply: true);
                }
              } else if (_selectedActionRadio == 'MOTOR_OFF') {
                _sendSmsWithAutoRetry(_cmdStop, expectReply: true);
                if (_motorState != 'STOPPED' || _runSec > 0) {
                  _finishSessionAndAddToAccount();
                }
              }
            }

            String _formatDate(DateTime dt) {
              return '${dt.day.toString().padLeft(2, "0")}/${dt.month.toString().padLeft(2, "0")}/${dt.year} ${dt.hour.toString().padLeft(2, "0")}:${dt.minute.toString().padLeft(2, "0")}';
            }

            String _hms(int s) {
              final h = (s ~/ 3600).toString().padLeft(2, '0');
              final m = ((s % 3600) ~/ 60).toString().padLeft(2, '0');
              final sec = (s % 60).toString().padLeft(2, '0');
              return '$h:$m:$sec';
            }

            void _toast(String msg) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(msg), duration: const Duration(seconds: 2)),
              );
            }

