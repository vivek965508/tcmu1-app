                                      const SizedBox(height: 4),
                                      Text('📅 ${s['date']}  •  ⏱️ Run: ${_hms(s['runSec'] ?? 0)} (Cut: ${_hms(s['cutSec'] ?? 0)})',
                                          style: const TextStyle(fontSize: 12)),
                                      const SizedBox(height: 4),
                                      Row(
                                        children: [
                                          Container(
                                            padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 2),
                                            decoration: BoxDecoration(
                                              color: isPaid ? Colors.green.shade100 : Colors.amber.shade100,
                                              borderRadius: BorderRadius.circular(10),
                                            ),
                                            child: Text(
                                              isPaid ? 'PAID' : 'UDHAAR / PENDING',
                                              style: TextStyle(
                                                fontSize: 10,
                                                fontWeight: FontWeight.bold,
                                                color: isPaid ? Colors.green.shade900 : Colors.amber.shade900,
                                              ),
                                            ),
                                          ),
                                          const SizedBox(width: 8),
                                          Text('Rate: ₹${(s['rate'] as num?)?.toStringAsFixed(0) ?? _stickyRate.toStringAsFixed(0)}/hr',
                                              style: const TextStyle(fontSize: 11, color: Colors.black54)),
                                          const Spacer(),
                                          const Text('Tap to Edit / Cash Memo ➔',
                                              style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold, color: Color(0xFF0F766E))),
                                        ],
                                      ),
                                    ],
                                  ),
                                ),
                              );
                            },
                          ),
                  ),
                ],
              );
            }

            // Popup when clicking any session in Account tab:
            // Customer Name + Sticky Rate + Manual Override Box + Share Cash Memo
            void _openSessionBillingPopup(int index) {
              final s = _sessions[index];
              final nameCtrl = TextEditingController(
                text: (s['needsSetup'] == true) ? '' : (s['customer']?.toString() ?? ''),
              );
              final rateCtrl = TextEditingController(
                text: ((s['rate'] as num?)?.toDouble() ?? _stickyRate).toStringAsFixed(0),
              );
              final manualCtrl = TextEditingController(
                text: (s['isManual'] == true) ? ((s['finalBill'] as num?)?.toStringAsFixed(0) ?? '') : '',
              );
              bool paidStatus = s['isPaid'] == true;

              showDialog(
                context: context,
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setDialogState) {
                    final int runSec = s['runSec'] ?? 0;
                    final double enteredRate = double.tryParse(rateCtrl.text.trim()) ?? _stickyRate;
                    final double autoCalculated = (runSec / 3600.0) * enteredRate;
                    final double? manualEntered = manualCtrl.text.trim().isEmpty
                        ? null
                        : double.tryParse(manualCtrl.text.trim());
                    final double finalAmount = manualEntered ?? autoCalculated;

                    return AlertDialog(
                      title: const Text('🧾 CASH MEMO & HISAB', style: TextStyle(fontWeight: FontWeight.bold)),
                      content: SingleChildScrollView(
                        child: Column(
                          mainAxisSize: MainAxisSize.min,
                          crossAxisAlignment: CrossAxisAlignment.start,
                          children: [
                            Text('Date: ${s['date']}\nRunning Time: ${_hms(runSec)} (Power Cut Minus: ${_hms(s['cutSec'] ?? 0)})',
                                style: const TextStyle(fontSize: 12, color: Colors.black54)),
                            const Divider(height: 20),
                            TextField(
                              controller: nameCtrl,
                              decoration: const InputDecoration(
                                labelText: 'Customer Name (ग्राहक का नाम)',
                                border: OutlineInputBorder(),
                                isDense: true,
                              ),
                            ),
                            const SizedBox(height: 10),
                            TextField(
                              controller: rateCtrl,
                              keyboardType: TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'Rate per Hour (₹) - Auto-saves for future',
                                border: OutlineInputBorder(),
                                isDense: true,
                              ),
                              onChanged: (_) => setDialogState(() {}),
                            ),
                            const SizedBox(height: 10),
                            TextField(
                              controller: manualCtrl,
                              keyboardType: TextInputType.number,
                              decoration: const InputDecoration(
                                labelText: 'Manual Bill Amount ₹ (Optional Override Box)',
                                hintText: 'Khali chhodein ya seedha fixed ₹ daalein',
                                border: OutlineInputBorder(),
                                isDense: true,
                              ),
                              onChanged: (_) => setDialogState(() {}),
                            ),
                            const SizedBox(height: 10),
                            SwitchListTile(
                              contentPadding: EdgeInsets.zero,
                              title: Text(paidStatus ? 'Status: PAID (नकद प्राप्त)' : 'Status: UDHAAR (बाकी)',
                                  style: TextStyle(
                                    fontWeight: FontWeight.bold,
                                    color: paidStatus ? Colors.green.shade800 : Colors.orange.shade900,
                                  )),
                              value: paidStatus,
                              onChanged: (v) => setDialogState(() => paidStatus = v),
                            ),
                            Container(
                              width: double.infinity,
                              padding: const EdgeInsets.all(12),
                              decoration: BoxDecoration(
                                color: const Color(0xFFF0FDF4),
                                borderRadius: BorderRadius.circular(10),
                                border: Border.all(color: Colors.green.shade300),
                              ),
                              child: Column(
                                children: [
                                  const Text('TOTAL CASH MEMO BILL', style: TextStyle(fontSize: 11, fontWeight: FontWeight.bold)),
                                  Text('₹${finalAmount.toStringAsFixed(2)}',
                                      style: const TextStyle(fontSize: 24, fontWeight: FontWeight.w900, color: Color(0xFF15803D))),
                                ],
                              ),
                            ),
                          ],
                        ),
                      ),
                      actions: [
                        TextButton(
                          onPressed: () {
                            final String cname = nameCtrl.text.trim().isEmpty ? 'Customer' : nameCtrl.text.trim();
                            final String slip = '🧾 *CASH MEMO*\n'
                                '--------------------------\n'
                                'Date: ${s['date']}\n'
                                'Customer: $cname\n'
                                'Running Time: ${_hms(runSec)}\n'
                                'Power Cut Minus: ${_hms(s['cutSec'] ?? 0)}\n'
                                'Rate: ₹${enteredRate.toStringAsFixed(0)}/hr\n'
                                '--------------------------\n'
                                '*TOTAL BILL: ₹${finalAmount.toStringAsFixed(2)}*\n'
                                'Status: ${paidStatus ? "PAID" : "UDHAAR"}\n'
                                '--------------------------';
                            platform.invokeMethod('shareText', {'text': slip});
                          },
                          child: const Text('📲 Share Cash Memo'),
                        ),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: const Color(0xFF0F766E), foregroundColor: Colors.white),
                          onPressed: () {
                            setState(() {
                              // Update sticky rate for all future sessions!
                              _stickyRate = enteredRate;
                              _sessions[index]['customer'] =
                                  nameCtrl.text.trim().isEmpty ? 'Walk-in Customer' : nameCtrl.text.trim();
                              _sessions[index]['needsSetup'] = false;
                              _sessions[index]['rate'] = enteredRate;
                              _sessions[index]['calcBill'] = autoCalculated;
                              _sessions[index]['finalBill'] = finalAmount;
                              _sessions[index]['isManual'] = manualEntered != null;
                              _sessions[index]['isPaid'] = paidStatus;
                            });
                            _saveState();
                            Navigator.pop(ctx);
                            _toast('Cash Memo Saved! Future Sticky Rate set to ₹${_stickyRate.toStringAsFixed(0)}/hr');
                          },
                          child: const Text('Save Bill'),
                        ),
                      ],
                    );
                  },
                ),
              );
            }

            // ===================================================================
            // TAB 3: SETTINGS & UNIVERSAL SMS CONFIG (Matches TCMU1_Config_Users_UI.png)
            // ===================================================================
            Widget _buildTab3SettingsAndConfig() {
              return ListView(
                padding: const EdgeInsets.all(14),
                children: [
                  // CARD 1: SETTINGS & USERS (Left side of user's reference image)
                  Card(
                    elevation: 2,
                    color: Colors.white,
                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(14)),
                    child: Padding(
                      padding: const EdgeInsets.all(16),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
