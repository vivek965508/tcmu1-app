name: Build TCMU-1 Android APK Automatically

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Design 2 Kisan Smart Card APK
        run: |
          flutter create tcmu1_app --org com.tcmu1.controller --platforms=android
          cd tcmu1_app

          python3 - << 'PYEOF'
          import os

          manifest = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>

              <application
                  android:label="TCMU-1 Controller"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".SmsBgReceiver"
                      android:permission="android.permission.BROADCAST_SMS"
                      android:exported="true">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED"/>
                      </intent-filter>
                  </receiver>

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>'''
          open('android/app/src/main/AndroidManifest.xml', 'w').write(manifest)

          kt_dir = 'android/app/src/main/kotlin/com/tcmu1/controller'
          os.makedirs(kt_dir, exist_ok=True)

          receiver_kt = '''package com.tcmu1.controller

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.provider.Telephony
          import org.json.JSONArray
          import org.json.JSONObject

          class SmsBgReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context?, intent: Intent?) {
                  if (context == null || intent?.action != Telephony.Sms.Intents.SMS_RECEIVED_ACTION) return
                  try {
                      val msgs = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                      val sb = StringBuilder()
                      var sender = ""
                      var earliestTs = System.currentTimeMillis()
                      for (m in msgs) {
                          sender = m.originatingAddress ?: ""
                          sb.append(m.messageBody ?: "")
                          if (m.timestampMillis > 0 && m.timestampMillis < earliestTs) {
                              earliestTs = m.timestampMillis
                          }
                      }
                      val body = sb.toString()
                      val prefs = context.getSharedPreferences("tcmu1_bg_queue", Context.MODE_PRIVATE)
                      val rawArr = prefs.getString("queue", "[]") ?: "[]"
                      val arr = JSONArray(rawArr)
                      val obj = JSONObject()
                      obj.put("sender", sender)
                      obj.put("body", body)
                      obj.put("ts", earliestTs)
                      arr.put(obj)
                      prefs.edit().putString("queue", arr.toString()).apply()

                      MainActivity.liveSink?.invoke(sender, body, earliestTs)
                  } catch (_: Exception) {}
              }
          }
          '''
          open(os.path.join(kt_dir, 'SmsBgReceiver.kt'), 'w').write(receiver_kt)

          main_kt = '''package com.tcmu1.controller

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.database.Cursor
          import android.net.Uri
          import android.os.Build
          import android.telephony.SmsManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONArray
          import org.json.JSONObject
          import kotlin.math.min

          class MainActivity: FlutterActivity() {
              companion object {
                  var liveSink: ((String, String, Long) -> Unit)? = null
              }

              private val CHANNEL = "com.tcmu1.controller/native"
              private var methodChannel: MethodChannel? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)

                  liveSink = { sender, body, ts ->
                      runOnUiThread {
                          methodChannel?.invokeMethod("onSmsReceived", mapOf("sender" to sender, "body" to body, "ts" to ts))
                      }
                  }

                  methodChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "requestSmsPermissions" -> {
                              if (!hasSmsPermissions()) {
                                  requestAllNeededPermissions()
                              }
                              result.success(hasSmsPermissions())
                          }
                          "hasPermissions" -> {
                              result.success(hasSmsPermissions())
                          }
                          "sendSms" -> {
                              val number = call.argument<String>("number") ?: ""
                              val message = call.argument<String>("message") ?: ""
                              try {
                                  if (!hasSmsPermissions()) {
                                      requestAllNeededPermissions()
                                      result.success(false)
                                  } else {
                                      val smsManager = SmsManager.getDefault()
                                      smsManager.sendTextMessage(number, null, message, null, null)
                                      result.success(true)
                                  }
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "popBackgroundSmsQueue" -> {
                              val prefs = getSharedPreferences("tcmu1_bg_queue", Context.MODE_PRIVATE)
                              val raw = prefs.getString("queue", "[]") ?: "[]"
                              prefs.edit().putString("queue", "[]").apply()
                              result.success(raw)
                          }
                          "readRecentInboxSms" -> {
                              val filterNum = call.argument<String>("motorSim") ?: ""
                              result.success(readDeviceSmsInbox(filterNum))
                          }
                          "shareText" -> {
                              val text = call.argument<String>("text") ?: ""
                              val sendIntent = Intent().apply {
                                  action = Intent.ACTION_SEND
                                  putExtra(Intent.EXTRA_TEXT, text)
                                  type = "text/plain"
                              }
                              startActivity(Intent.createChooser(sendIntent, "Share Cash Memo"))
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              private fun hasSmsPermissions(): Boolean {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.M) return true
                  val s1 = checkSelfPermission(Manifest.permission.SEND_SMS) == PackageManager.PERMISSION_GRANTED
                  val s2 = checkSelfPermission(Manifest.permission.RECEIVE_SMS) == PackageManager.PERMISSION_GRANTED
                  val s3 = checkSelfPermission(Manifest.permission.READ_SMS) == PackageManager.PERMISSION_GRANTED
                  return s1 && s2 && s3
              }

              private fun requestAllNeededPermissions() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      requestPermissions(
                          arrayOf(
                              Manifest.permission.SEND_SMS,
                              Manifest.permission.RECEIVE_SMS,
                              Manifest.permission.READ_SMS
                          ),
                          101
                      )
                  }
              }

              // Uses earliest of (date, date_sent) so if multiple phones receive SMS at different delays,
              // the earliest hardware/network timestamp is used as the true master time!
              private fun readDeviceSmsInbox(motorSim: String): String {
                  val arr = JSONArray()
                  if (!hasSmsPermissions()) return arr.toString()
                  val cleanFilter = motorSim.replace(Regex("[^0-9]"), "")
                  val last10 = if (cleanFilter.length >= 10) cleanFilter.takeLast(10) else cleanFilter
                  var cursor: Cursor? = null
                  try {
                      cursor = contentResolver.query(
                          Uri.parse("content://sms/inbox"),
                          arrayOf("address", "body", "date", "date_sent"),
                          null,
                          null,
                          "date ASC LIMIT 250"
                      )
                      if (cursor != null && cursor.moveToFirst()) {
                          do {
                              val addr = cursor.getString(0) ?: ""
                              val body = cursor.getString(1) ?: ""
                              val dateRecv = cursor.getLong(2)
                              val dateSent = cursor.getLong(3)
                              val earliestTs = if (dateSent > 1000000000000L) min(dateRecv, dateSent) else dateRecv
                              if (last10.isEmpty() || addr.contains(last10)) {
                                  val o = JSONObject()
                                  o.put("sender", addr)
                                  o.put("body", body)
                                  o.put("ts", earliestTs)
                                  arr.put(o)
                              }
                          } while (cursor.moveToNext())
                      }
                  } catch (_: Exception) {
                  } finally {
                      cursor?.close()
                  }
                  return arr.toString()
              }

              override fun onDestroy() {
                  liveSink = null
                  super.onDestroy()
              }
          }
          '''
          open(os.path.join(kt_dir, 'MainActivity.kt'), 'w').write(main_kt)
          PYEOF

          cat << 'DARTEOF' > lib/main.dart
          import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const KisanSmartMotorApp());
          }

          class KisanSmartMotorApp extends StatelessWidget {
            const KisanSmartMotorApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'Kisan Motor Remote',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  scaffoldBackgroundColor: const Color(0xFFF8FAFC),
                  colorSchemeSeed: const Color(0xFF0284C7),
                ),
                home: const Design2Dashboard(),
              );
            }
          }

          class Design2Dashboard extends StatefulWidget {
            const Design2Dashboard({super.key});
            @override
            State<Design2Dashboard> createState() => _Design2DashboardState();
          }

          class _Design2DashboardState extends State<Design2Dashboard> with WidgetsBindingObserver {
            static const platform = MethodChannel('com.tcmu1.controller/native');

            int _currentTab = 0; // 0 = Control, 1 = Account, 2 = Settings
            bool _settingsUnlocked = false;
            String _settingsPin = '1234';

            // Design 2 Front Electricity Mode Radio Button (4*1 vs 4*0)
            bool _electricityAutoOn = true;

            // Universal Config State
            String _motorSim = '+919876543210';
            double _stickyRate = 120.0;
            List<String> _users = ['8081728811', '7839455008', '', '9236504217'];

            String _cmdStart = '1*';
            String _replyStart = 'PUMP STARTED';
            String _cmdStop = '2*';
            String _replyStop = 'PUMP STOPPED';
            String _cmdAutoOn = '4*1';
            String _replyAutoOn = 'SUCCESSFULLY SET AUTO MODE';
            String _replyTimerStart = 'PUMP STARTED';
            String _replyTimerEnd = 'PUMP STOPPED';
            String _replyPowerCut = 'POWER OFF PUMP OFF';
            String _replyPowerResume = 'POWER RESUME PUMP STARTED';
            String _replyPhysStart = 'manual start';
            String _replyPhysStop = 'manual stop';

            // Live Motor & Retry Engine State
            String _motorState = 'STOPPED'; // STOPPED, RUNNING, PAUSED
            String _powerState = 'AVAILABLE';
            String _signalState = '63%';
            String _activeMode = 'Normal (1*)';
            String _activeTriggerSource = 'Verified by SMS Reply';
            DateTime? _sessionStartTime;
            DateTime? _buttonPressStartTime;
            int _runSec = 0;
            int _cutSec = 0;
            int _targetTimerSec = 0;

            // 15-Second 3x Retry Engine State
            bool _awaitingReply = false;
            String _pendingCmdType = ''; // 'START' or 'STOP'
            String _pendingCmdText = '';
            int _retryAttempt = 0; // 1, 2, 3
            int _retryCountdownSec = 0;
            Timer? _retryTickTimer;
            Timer? _clockTimer;
            Timer? _periodicStatusTimer;

            // Account / Hisab Sessions
            List<Map<String, dynamic>> _sessions = [];

            // Settings Controllers (Matches TCMU1_Config_Users_UI.png)
            final TextEditingController _simCtrl = TextEditingController(text: '+919876543210');
            late List<TextEditingController> _userCtrls;
            final TextEditingController _cmdStartCtrl = TextEditingController(text: '1*');
            final TextEditingController _repStartCtrl = TextEditingController(text: 'PUMP STARTED');
            final TextEditingController _cmdStopCtrl = TextEditingController(text: '2*');
            final TextEditingController _repStopCtrl = TextEditingController(text: 'PUMP STOPPED');
            final TextEditingController _cmdAutoCtrl = TextEditingController(text: '4*1');
            final TextEditingController _repAutoCtrl = TextEditingController(text: 'SUCCESSFULLY SET AUTO MODE');
            final TextEditingController _repCutCtrl = TextEditingController(text: 'POWER OFF PUMP OFF');
            final TextEditingController _repResCtrl = TextEditingController(text: 'POWER RESUME PUMP STARTED');
            final TextEditingController _repPhysOnCtrl = TextEditingController(text: 'manual start');
            final TextEditingController _repPhysOffCtrl = TextEditingController(text: 'manual stop');
            final TextEditingController _repTimerOnCtrl = TextEditingController(text: 'PUMP STARTED');
            final TextEditingController _repTimerOffCtrl = TextEditingController(text: 'PUMP STOPPED');

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addObserver(this);
              _userCtrls = List.generate(4, (i) => TextEditingController(text: _users[i]));

              _loadSavedState().then((_) async {
                await platform.invokeMethod('requestSmsPermissions');
                await _drainBgQueueAndSyncInbox(silent: true);
              });

              platform.setMethodCallHandler((call) async {
                if (call.method == 'onSmsReceived') {
                  final map = Map<String, dynamic>.from(call.arguments);
                  _processIncomingSms(
                    map['sender']?.toString() ?? '',
                    map['body']?.toString() ?? '',
                    (map['ts'] as int?) ?? DateTime.now().millisecondsSinceEpoch,
                  );
                }
              });

              // Periodic background inbox sync every 30 seconds while app is open
              _periodicStatusTimer = Timer.periodic(const Duration(seconds: 30), (_) {
                _drainBgQueueAndSyncInbox(silent: true);
              });
            }

            @override
            void dispose() {
              WidgetsBinding.instance.removeObserver(this);
              _retryTickTimer?.cancel();
              _clockTimer?.cancel();
              _periodicStatusTimer?.cancel();
              super.dispose();
            }

            @override
            void didChangeAppLifecycleState(AppLifecycleState state) {
              if (state == AppLifecycleState.resumed) {
                _drainBgQueueAndSyncInbox(silent: true);
              }
            }

            File get _storageFile => File('${Directory.systemTemp.path}/tcmu1_design2_v3.json');

            Future<void> _loadSavedState() async {
              try {
                if (await _storageFile.exists()) {
                  final data = jsonDecode(await _storageFile.readAsString());
                  setState(() {
                    _motorSim = data['motorSim'] ?? '+919876543210';
                    _simCtrl.text = _motorSim;
                    _stickyRate = (data['stickyRate'] ?? 120.0).toDouble();
                    _electricityAutoOn = data['autoMode'] ?? true;
                    _users = List<String>.from(data['users'] ?? ['8081728811', '7839455008', '', '9236504217']);
                    for (int i = 0; i < 4; i++) {
                      _userCtrls[i].text = _users[i];
                    }
                    _cmdStart = data['cmdStart'] ?? '1*';
                    _cmdStartCtrl.text = _cmdStart;
                    _replyStart = data['replyStart'] ?? 'PUMP STARTED';
                    _repStartCtrl.text = _replyStart;
                    _cmdStop = data['cmdStop'] ?? '2*';
                    _cmdStopCtrl.text = _cmdStop;
                    _replyStop = data['replyStop'] ?? 'PUMP STOPPED';
                    _repStopCtrl.text = _replyStop;
                    _cmdAutoOn = data['cmdAutoOn'] ?? '4*1';
                    _cmdAutoCtrl.text = _cmdAutoOn;
                    _replyAutoOn = data['replyAutoOn'] ?? 'SUCCESSFULLY SET AUTO MODE';
                    _repAutoCtrl.text = _replyAutoOn;
                    _replyPowerCut = data['replyPowerCut'] ?? 'POWER OFF PUMP OFF';
                    _repCutCtrl.text = _replyPowerCut;
                    _replyPowerResume = data['replyPowerResume'] ?? 'POWER RESUME PUMP STARTED';
                    _repResCtrl.text = _replyPowerResume;
                    _replyPhysStart = data['replyPhysStart'] ?? 'manual start';
                    _repPhysOnCtrl.text = _replyPhysStart;
                    _replyPhysStop = data['replyPhysStop'] ?? 'manual stop';
                    _repPhysOffCtrl.text = _replyPhysStop;
                    _replyTimerStart = data['replyTimerStart'] ?? 'PUMP STARTED';
                    _repTimerOnCtrl.text = _replyTimerStart;
                    _replyTimerEnd = data['replyTimerEnd'] ?? 'PUMP STOPPED';
                    _repTimerOffCtrl.text = _replyTimerEnd;
                    _sessions = List<Map<String, dynamic>>.from(data['sessions'] ?? []);
                  });
                }
              } catch (_) {}
            }

            Future<void> _saveState() async {
              try {
                final map = {
                  'motorSim': _motorSim,
                  'stickyRate': _stickyRate,
                  'autoMode': _electricityAutoOn,
                  'users': _users,
                  'cmdStart': _cmdStart,
                  'replyStart': _replyStart,
                  'cmdStop': _cmdStop,
                  'replyStop': _replyStop,
                  'cmdAutoOn': _cmdAutoOn,
                  'replyAutoOn': _replyAutoOn,
                  'replyPowerCut': _replyPowerCut,
                  'replyPowerResume': _replyPowerResume,
                  'replyPhysStart': _replyPhysStart,
                  'replyPhysStop': _replyPhysStop,
                  'replyTimerStart': _replyTimerStart,
                  'replyTimerEnd': _replyTimerEnd,
                  'sessions': _sessions,
                };
                await _storageFile.writeAsString(jsonEncode(map));
              } catch (_) {}
            }

            // ===================================================================
            // 15-SECOND 3-ATTEMPT RETRY ENGINE + FALLBACK TIMESTAMP LOGIC
            // ===================================================================
            Future<void> _sendCommandWith15sRetry({
              required String cmd,
              required String cmdType, // 'START', 'STOP', or 'OTHER'
              String modeLabel = 'Normal (1*)',
              int timerMinutes = 0,
            }) async {
              final DateTime pressMoment = DateTime.now();

              if (cmdType == 'START') {
                _buttonPressStartTime = pressMoment;
                _activeMode = modeLabel;
                _targetTimerSec = timerMinutes * 60;
              }

              // Send Attempt 1 immediately
              final bool ok = await platform.invokeMethod('sendSms', {'number': _motorSim, 'message': cmd}) ?? false;
              if (!ok) {
                _toast('Please allow SMS permission in Settings!');
                return;
              }

              if (cmdType == 'OTHER') {
                _toast('SMS Sent: $cmd');
                return;
              }

              setState(() {
                _awaitingReply = true;
                _pendingCmdType = cmdType;
                _pendingCmdText = cmd;
                _retryAttempt = 1;
                _retryCountdownSec = 15;
              });
              _toast('Sent $cmd (Attempt 1/3) — Waiting 15s for reply...');

              _retryTickTimer?.cancel();
              _retryTickTimer = Timer.periodic(const Duration(seconds: 1), (t) async {
                if (!_awaitingReply) {
                  t.cancel();
                  return;
                }
                setState(() => _retryCountdownSec--);

                if (_retryCountdownSec <= 0) {
                  if (_retryAttempt < 3) {
                    // Send Attempt 2 or Attempt 3 after 15 seconds
                    setState(() {
                      _retryAttempt++;
                      _retryCountdownSec = 15;
                    });
                    await platform.invokeMethod('sendSms', {'number': _motorSim, 'message': _pendingCmdText});
                    _toast('No reply! Re-sending $_pendingCmdText (Attempt $_retryAttempt/3)...');
                  } else {
                    // All 3 attempts (3 x 15s) finished without reply -> Use initial SMS Sent Time!
                    t.cancel();
                    setState(() => _awaitingReply = false);
                    if (_pendingCmdType == 'START') {
                      final DateTime fallbackStart = _buttonPressStartTime ?? DateTime.now();
                      final int elapsedAlready = DateTime.now().difference(fallbackStart).inSeconds.clamp(0, 3600);
                      setState(() {
                        _sessionStartTime = fallbackStart;
                        _motorState = 'RUNNING';
                        _runSec = elapsedAlready;
                        _cutSec = 0;
                        _activeTriggerSource = '⚠️ Start by SMS Sent Time (No Machine Reply after 3 retries)';
                      });
                      _ensureClockTicking();
                      _toast('No reply after 3 retries! Started from 1st SMS Sent Time.');
                    } else if (_pendingCmdType == 'STOP') {
                      _completeAndSaveSession(
                        stopNote: '⚠️ Stop by SMS Sent Time (No Machine Reply after 3 retries)',
                      );
                      _toast('No reply after 3 retries! Saved session using SMS Sent Time.');
                    }
                  }
                }
              });
            }

            // ===================================================================
            // MULTI-PHONE EARLIEST SMS SYNC & ONGOING RUNNING SESSION DETECTION
            // ===================================================================
            Future<void> _drainBgQueueAndSyncInbox({bool silent = false}) async {
              try {
                final String rawQ = await platform.invokeMethod('popBackgroundSmsQueue') ?? '[]';
                final List<dynamic> qList = jsonDecode(rawQ);
                for (final item in qList) {
                  _processIncomingSms(
                    item['sender']?.toString() ?? '',
                    item['body']?.toString() ?? '',
                    (item['ts'] as int?) ?? DateTime.now().millisecondsSinceEpoch,
                  );
                }

                // Read device SMS inbox to sync missed messages & detect if motor is currently running
                final String rawInbox = await platform.invokeMethod('readRecentInboxSms', {'motorSim': _motorSim}) ?? '[]';
                final List<dynamic> list = jsonDecode(rawInbox);
                if (list.isEmpty) {
                  if (!silent) _toast('No SMS found in Inbox for $_motorSim');
                  return;
                }

                DateTime? openStart;
                DateTime? pauseStart;
                int pausedAccum = 0;
                String openMode = 'Normal Start';
                String openSource = '✅ Synced from Earliest SMS Timestamp';
                int newlyAdded = 0;

                for (final item in list) {
                  final String body = (item['body']?.toString() ?? '').trim();
                  final String up = body.toUpperCase();
                  final int ts = (item['ts'] as int?) ?? 0;
                  final DateTime dt = DateTime.fromMillisecondsSinceEpoch(ts);

                  if (up.contains('TCMU-1 USERS') || up.contains('USER1')) {
                    _parseUsersFromSms(body);
                  } else if (up.contains(_replyStart.toUpperCase()) || up.contains(_replyPhysStart.toUpperCase())) {
                    // Multi-phone deduplication: if already open within 2 minutes, keep the EARLIEST timestamp
                    if (openStart == null || dt.difference(openStart).inSeconds.abs() > 120) {
                      openStart = dt;
                      pauseStart = null;
                      pausedAccum = 0;
                      openMode = up.contains(_replyPhysStart.toUpperCase()) ? 'Physical Button Start' : 'Motor Start (SMS)';
                      openSource = up.contains(_replyPhysStart.toUpperCase())
                          ? '🖐️ Physical Start SMS (Earliest Timestamp)'
                          : '✅ Verified by Machine Reply SMS (Earliest Timestamp)';
                    }
                  } else if (up.contains(_replyPowerCut.toUpperCase()) && openStart != null) {
                    pauseStart ??= dt;
                  } else if (up.contains(_replyPowerResume.toUpperCase()) && openStart != null && pauseStart != null) {
                    pausedAccum += dt.difference(pauseStart).inSeconds.abs();
                    pauseStart = null;
                  } else if ((up.contains(_replyStop.toUpperCase()) || up.contains(_replyPhysStop.toUpperCase())) && openStart != null) {
                    if (pauseStart != null) {
                      pausedAccum += dt.difference(pauseStart).inSeconds.abs();
                      pauseStart = null;
                    }
                    final int totalSec = dt.difference(openStart).inSeconds.abs();
                    final int netSec = (totalSec - pausedAccum).clamp(60, 86400);
                    // Group session key by 2-minute bucket so multi-phone slight delays never duplicate
                    final int bucketKey = (openStart.millisecondsSinceEpoch ~/ 120000);
                    final String sessionId = 'SYNC_$bucketKey';
                    final bool exists = _sessions.any((s) => s['id'] == sessionId);
                    if (!exists) {
                      final double calcAmt = double.parse(((netSec / 3600.0) * _stickyRate).toStringAsFixed(2));
                      _sessions.insert(0, {
                        'id': sessionId,
                        'date': _formatDate(openStart),
                        'customer': 'Tap to Enter Customer Name',
                        'needsSetup': true,
                        'mode': openMode,
                        'triggerSource': openSource,
                        'runSec': netSec,
                        'cutSec': pausedAccum,
                        'rate': _stickyRate,
                        'calcBill': calcAmt,
                        'finalBill': calcAmt,
                        'isManual': false,
                        'isPaid': false,
                      });
                      newlyAdded++;
                    }
                    openStart = null;
                    pauseStart = null;
                    pausedAccum = 0;
                  }
                }

                // If openStart is STILL not null after reading the entire inbox,
                // that means the motor is CURRENTLY RUNNING (or PAUSED on power cut) right now!
                if (openStart != null && _motorState == 'STOPPED') {
                  final DateTime now = DateTime.now();
                  int currentCut = pausedAccum;
                  if (pauseStart != null) {
                    currentCut += now.difference(pauseStart).inSeconds.abs();
                  }
                  final int totalElapsed = now.difference(openStart).inSeconds.abs();
                  final int netRunning = (totalElapsed - currentCut).clamp(0, 86400);
                  setState(() {
                    _sessionStartTime = openStart;
                    _activeMode = openMode;
                    _activeTriggerSource = openSource;
                    _runSec = netRunning;
                    _cutSec = currentCut;
                    _motorState = (pauseStart != null) ? 'PAUSED' : 'RUNNING';
                    _powerState = (pauseStart != null) ? 'POWER CUT' : 'AVAILABLE';
                  });
                  _ensureClockTicking();
                }

                await _saveState();
                setState(() {});
                if (!silent) {
                  _toast('Synced all SMS! Added $newlyAdded session(s). Motor is $_motorState.');
                }
              } catch (_) {}
            }

            void _parseUsersFromSms(String raw) {
              final List<String> parsed = ['', '', '', ''];
              for (int i = 1; i <= 4; i++) {
                final rx = RegExp(r'USER\s*' + i.toString() + r'\s*=\s*(\d{10,12})', caseSensitive: false);
                final m = rx.firstMatch(raw);
                if (m != null) parsed[i - 1] = m.group(1) ?? '';
              }
              setState(() {
                _users = parsed;
                for (int i = 0; i < 4; i++) {
                  _userCtrls[i].text = _users[i];
                }
              });
              _saveState();
            }

            void _processIncomingSms(String sender, String rawBody, int tsMillis) {
              final String body = rawBody.trim();
              final String up = body.toUpperCase();
              final DateTime msgTime = DateTime.fromMillisecondsSinceEpoch(tsMillis);

              // 1. Users Reply (*TCMU-1 USERS*)
              if (up.contains('TCMU-1 USERS') || up.contains('USER1')) {
                _parseUsersFromSms(body);
                _toast('Users Synced from TCMU-1!');
                return;
              }

              // 2. Status (5*) Reply (**TCMU-1 STATUS**)
              if (up.contains('TCMU-1 STATUS')) {
                setState(() {
                  if (up.contains('POWER AVAILABLE')) _powerState = 'AVAILABLE';
                  if (up.contains('POWER OFF')) _powerState = 'OFF';
                  final sig = RegExp(r'SIGNAL\s*:\s*(\d+%)', caseSensitive: false).firstMatch(body);
                  if (sig != null) _signalState = sig.group(1)!;
                  if (up.contains('MODE : AUTO')) _electricityAutoOn = true;
                  if (up.contains('MODE : MANUAL')) _electricityAutoOn = false;
                  if (up.contains('PUMP : STOPPED') && _motorState != 'STOPPED') {
                    _completeAndSaveSession(stopNote: '✅ Verified by Status (5*) Reply');
                  } else if ((up.contains('PUMP : RUNNING') || up.contains('PUMP : STARTED') || up.contains('PUMP : ON')) &&
                      _motorState == 'STOPPED') {
                    _sessionStartTime = msgTime;
                    _motorState = 'RUNNING';
                    _activeTriggerSource = '✅ Detected Running via Status (5*) Check';
                    _ensureClockTicking();
                  }
                });
                _toast('Status (5*) Synced: Motor is $_motorState');
                return;
              }

              // 3. Power Cut
              if (_replyPowerCut.isNotEmpty && up.contains(_replyPowerCut.toUpperCase())) {
                if (_motorState == 'RUNNING') {
                  setState(() {
                    _motorState = 'PAUSED';
                    _powerState = 'POWER CUT';
                  });
                  _toast('Electricity OFF! Timer PAUSED.');
                }
                return;
              }

              // 4. Power Resume
              if (_replyPowerResume.isNotEmpty && up.contains(_replyPowerResume.toUpperCase())) {
                if (_motorState == 'PAUSED') {
                  setState(() {
                    _motorState = 'RUNNING';
                    _powerState = 'AVAILABLE';
                  });
                  _ensureClockTicking();
                  _toast('Electricity Resumed! Timer RESUMED.');
                }
                return;
              }

              // 5. Physical Manual Start
              if (_replyPhysStart.isNotEmpty && up.contains(_replyPhysStart.toUpperCase())) {
                _retryTickTimer?.cancel();
                setState(() {
                  _awaitingReply = false;
                  if (_motorState == 'STOPPED') {
                    _sessionStartTime = msgTime;
                    _activeMode = 'Physical Button Start';
                    _activeTriggerSource = '🖐️ Started by Physical Button SMS';
                    _motorState = 'RUNNING';
                    _runSec = 0;
                    _cutSec = 0;
                  }
                });
                _ensureClockTicking();
                _toast('Physical Button Start Detected!');
                return;
              }

              // 6. Stop Confirmation (Normal / Timer / Physical)
              if ((_replyPhysStop.isNotEmpty && up.contains(_replyPhysStop.toUpperCase())) ||
                  (_replyStop.isNotEmpty && up.contains(_replyStop.toUpperCase())) ||
                  (_replyTimerEnd.isNotEmpty && up.contains(_replyTimerEnd.toUpperCase()))) {
                _retryTickTimer?.cancel();
                setState(() => _awaitingReply = false);
                if (_motorState != 'STOPPED' || _runSec > 0) {
                  _completeAndSaveSession(
                    stopNote: up.contains(_replyPhysStop.toUpperCase())
                        ? '🖐️ Stopped by Physical Button SMS'
                        : '✅ Verified by Machine Reply SMS (PUMP STOPPED)',
                  );
                  _toast('Motor Stopped! Saved to Account tab.');
                }
                return;
              }

              // 7. Start Confirmation (PUMP STARTED)
              if ((_replyStart.isNotEmpty && up.contains(_replyStart.toUpperCase())) ||
                  (_replyTimerStart.isNotEmpty && up.contains(_replyTimerStart.toUpperCase()))) {
                _retryTickTimer?.cancel();
                setState(() {
                  _awaitingReply = false;
                  if (_motorState == 'STOPPED') {
                    // Earliest timestamp rule
                    final DateTime candidate = (_buttonPressStartTime != null && _buttonPressStartTime!.isBefore(msgTime))
                        ? _buttonPressStartTime!
                        : msgTime;
                    _sessionStartTime = candidate;
                    _motorState = 'RUNNING';
                    _runSec = DateTime.now().difference(candidate).inSeconds.clamp(0, 600);
                    _cutSec = 0;
                  }
                  _activeTriggerSource = '✅ Verified by Machine Reply SMS (Attempt $_retryAttempt)';
                });
                _ensureClockTicking();
                _toast('Confirmed: PUMP STARTED!');
              }
            }

            void _ensureClockTicking() {
              _clockTimer?.cancel();
              _clockTimer = Timer.periodic(const Duration(seconds: 1), (t) {
                setState(() {
                  if (_motorState == 'RUNNING') {
                    _runSec++;
                    if (_targetTimerSec > 0 && _runSec >= _targetTimerSec) {
                      _completeAndSaveSession(stopNote: '⏱️ Completed by Timer (3*X)');
                    }
                  } else if (_motorState == 'PAUSED') {
                    _cutSec++;
                  }
                });
              });
            }

            void _completeAndSaveSession({required String stopNote}) {
              _clockTimer?.cancel();
              final int finalRunSec = _runSec > 0 ? _runSec : 60;
              final double calcAmt = double.parse(((finalRunSec / 3600.0) * _stickyRate).toStringAsFixed(2));
              final DateTime startDt = _sessionStartTime ?? DateTime.now();
              final int bucketKey = (startDt.millisecondsSinceEpoch ~/ 120000);

              final newSession = {
                'id': 'SES_$bucketKey',
                'date': _formatDate(startDt),
                'customer': 'Tap to Enter Customer Name',
                'needsSetup': true,
                'mode': _activeMode,
                'triggerSource': '$_activeTriggerSource | $stopNote',
                'runSec': finalRunSec,
                'cutSec': _cutSec,
                'rate': _stickyRate,
                'calcBill': calcAmt,
                'finalBill': calcAmt,
                'isManual': false,
                'isPaid': false,
              };

              setState(() {
                _motorState = 'STOPPED';
                _sessions.removeWhere((s) => s['id'] == newSession['id']);
                _sessions.insert(0, newSession);
              });
              _saveState();
            }

            String _formatDate(DateTime dt) {
              return '${dt.day.toString().padLeft(2, "0")}/${dt.month.toString().padLeft(2, "0")}/${dt.year} ${dt.hour.toString().padLeft(2, "0")}:${dt.minute.toString().padLeft(2, "0")}';
            }

            String _hms(int s) {
              final h = (s ~/ 3600).toString().padLeft(2, '0');
              final m = ((s % 3600) ~/ 60).toString().padLeft(2, '0');
              final sec = (s % 60).toString().padLeft(2, '0');
              return '$h:$m:$sec';
            }

            void _toast(String msg) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text(msg), duration: const Duration(seconds: 2)),
              );
            }

