name: Build TCMU-1 Android APK Automatically

on:
  push:
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'

      - name: Generate Clean Project and Build APK
        run: |
          flutter create tcmu1_app --org com.tcmu1.controller --platforms=android
          cd tcmu1_app

          python3 - << 'PYEOF'
          import os

          manifest = '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SEND_SMS"/>
              <uses-permission android:name="android.permission.RECEIVE_SMS"/>
              <uses-permission android:name="android.permission.READ_SMS"/>
              <application
                  android:label="TCMU-1 Smart Billing"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">
                      <meta-data
                        android:name="io.flutter.embedding.android.NormalTheme"
                        android:resource="@style/NormalTheme"
                        />
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />
              </application>
          </manifest>'''
          open('android/app/src/main/AndroidManifest.xml', 'w').write(manifest)

          kt_dir = 'android/app/src/main/kotlin/com/tcmu1/controller'
          os.makedirs(kt_dir, exist_ok=True)
          kt_code = '''package com.tcmu1.controller

          import android.Manifest
          import android.app.KeyguardManager
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Telephony
          import android.telephony.SmsManager
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.tcmu1.controller/native"
              private var methodChannel: MethodChannel? = null
              private var smsReceiver: BroadcastReceiver? = null
              private var pendingAuthResult: MethodChannel.Result? = null
              private val AUTH_REQ_CODE = 901

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  methodChannel = MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL)
                  methodChannel?.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "requestPermissions" -> {
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                                  requestPermissions(
                                      arrayOf(Manifest.permission.SEND_SMS, Manifest.permission.RECEIVE_SMS, Manifest.permission.READ_SMS),
                                      101
                                  )
                              }
                              result.success(true)
                          }
                          "sendSms" -> {
                              val number = call.argument<String>("number") ?: ""
                              val message = call.argument<String>("message") ?: ""
                              try {
                                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M &&
                                      checkSelfPermission(Manifest.permission.SEND_SMS) != PackageManager.PERMISSION_GRANTED) {
                                      requestPermissions(arrayOf(Manifest.permission.SEND_SMS, Manifest.permission.RECEIVE_SMS), 101)
                                      result.success(false)
                                  } else {
                                      val smsManager = SmsManager.getDefault()
                                      smsManager.sendTextMessage(number, null, message, null, null)
                                      result.success(true)
                                  }
                              } catch (e: Exception) {
                                  result.success(false)
                              }
                          }
                          "authenticateDevice" -> {
                              val km = getSystemService(Context.KEYGUARD_SERVICE) as KeyguardManager
                              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP && km.isKeyguardSecure) {
                                  @Suppress("DEPRECATION")
                                  val intent = km.createConfirmDeviceCredentialIntent("TCMU-1 Security", "Unlock with Phone PIN, Pattern, or Fingerprint")
                                  if (intent != null) {
                                      pendingAuthResult = result
                                      startActivityForResult(intent, AUTH_REQ_CODE)
                                  } else {
                                      result.success(true)
                                  }
                              } else {
                                  result.success(true)
                              }
                          }
                          "shareText" -> {
                              val text = call.argument<String>("text") ?: ""
                              val sendIntent = Intent().apply {
                                  action = Intent.ACTION_SEND
                                  putExtra(Intent.EXTRA_TEXT, text)
                                  type = "text/plain"
                              }
                              val shareIntent = Intent.createChooser(sendIntent, "Share Cash Memo")
                              startActivity(shareIntent)
                              result.success(true)
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == AUTH_REQ_CODE) {
                      pendingAuthResult?.success(resultCode == RESULT_OK)
                      pendingAuthResult = null
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  smsReceiver = object : BroadcastReceiver() {
                      override fun onReceive(context: Context?, intent: Intent?) {
                          if (intent?.action == Telephony.Sms.Intents.SMS_RECEIVED_ACTION) {
                              val msgs = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                              val sb = StringBuilder()
                              var sender = ""
                              for (msg in msgs) {
                                  sender = msg.originatingAddress ?: ""
                                  sb.append(msg.messageBody)
                              }
                              methodChannel?.invokeMethod("onSmsReceived", mapOf("sender" to sender, "body" to sb.toString()))
                          }
                      }
                  }
                  val filter = IntentFilter(Telephony.Sms.Intents.SMS_RECEIVED_ACTION)
                  if (Build.VERSION.SDK_INT >= 33) {
                      registerReceiver(smsReceiver, filter, Context.RECEIVER_EXPORTED)
                  } else {
                      registerReceiver(smsReceiver, filter)
                  }
              }

              override fun onDestroy() {
                  if (smsReceiver != null) {
                      unregisterReceiver(smsReceiver)
                  }
                  super.onDestroy()
              }
          }
          '''
          open(os.path.join(kt_dir, 'MainActivity.kt'), 'w').write(kt_code)

          dart_code = '''import 'dart:async';
          import 'dart:convert';
          import 'dart:io';
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            runApp(const TcmuApp());
          }

          class TcmuApp extends StatelessWidget {
            const TcmuApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'TCMU-1 Smart Billing',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorSchemeSeed: const Color(0xFF0F766E),
                ),
                home: const DashboardPage(),
              );
            }
          }

          class DashboardPage extends StatefulWidget {
            const DashboardPage({super.key});
            @override
            State<DashboardPage> createState() => _DashboardPageState();
          }

          class _DashboardPageState extends State<DashboardPage> {
            static const platform = MethodChannel('com.tcmu1.controller/native');
            int _tab = 0;
            bool _settingsUnlocked = false;

            String _motorSim = '+919876543210';
            double _stickyRate = 120.0;
            bool _autoMode = true;
            List<String> _users = ['8081728811', '7839455008', '', '9236504217'];

            String _cmdStart = '1*';
            String _replyStart = 'PUMP STARTED';
            String _cmdStop = '2*';
            String _replyStop = 'PUMP STOPPED';
            String _replyTimerStart = 'PUMP STARTED';
            String _replyTimerEnd = 'PUMP STOPPED';
            String _replyPowerCut = 'POWER OFF PUMP OFF';
            String _replyPowerResume = 'POWER RESUME PUMP STARTED';
            String _replyPhysStart = 'manual start';
            String _replyPhysStop = 'manual stop';

            String _motorState = 'STOPPED';
            String _powerState = 'AVAILABLE';
            String _signal = '63%';
            String _activeCustomer = '';
            String _activeMode = 'Normal (1*)';
            int _runSec = 0;
            int _cutSec = 0;
            int _targetSec = 0;
            int _cooldown = 0;
            Timer? _clock;
            Timer? _cdTimer;

            final TextEditingController _custCtrl = TextEditingController();
            final TextEditingController _rateCtrl = TextEditingController(text: '120');
            final TextEditingController _manualAmtCtrl = TextEditingController();
            final TextEditingController _simCtrl = TextEditingController(text: '+919876543210');
            final TextEditingController _timerXCtrl = TextEditingController(text: '2');

            List<Map<String, dynamic>> _history = [];

            @override
            void initState() {
              super.initState();
              _loadLocalState();
              platform.invokeMethod('requestPermissions');
              platform.setMethodCallHandler((call) async {
                if (call.method == 'onSmsReceived') {
                  final map = Map<String, dynamic>.from(call.arguments);
                  _handleIncomingSms(map['body'] ?? '');
                }
              });
            }

            File get _stateFile => File('${Directory.systemTemp.path}/tcmu1_state_v1.json');

            Future<void> _loadLocalState() async {
              try {
                if (await _stateFile.exists()) {
                  final data = jsonDecode(await _stateFile.readAsString());
                  setState(() {
                    _motorSim = data['motorSim'] ?? '+919876543210';
                    _simCtrl.text = _motorSim;
                    _stickyRate = (data['stickyRate'] ?? 120.0).toDouble();
                    _rateCtrl.text = _stickyRate.toStringAsFixed(0);
                    _autoMode = data['autoMode'] ?? true;
                    _users = List<String>.from(data['users'] ?? ['8081728811', '7839455008', '', '9236504217']);
                    _cmdStart = data['cmdStart'] ?? '1*';
                    _replyStart = data['replyStart'] ?? 'PUMP STARTED';
                    _cmdStop = data['cmdStop'] ?? '2*';
                    _replyStop = data['replyStop'] ?? 'PUMP STOPPED';
                    _replyTimerStart = data['replyTimerStart'] ?? 'PUMP STARTED';
                    _replyTimerEnd = data['replyTimerEnd'] ?? 'PUMP STOPPED';
                    _replyPowerCut = data['replyPowerCut'] ?? 'POWER OFF PUMP OFF';
                    _replyPowerResume = data['replyPowerResume'] ?? 'POWER RESUME PUMP STARTED';
                    _replyPhysStart = data['replyPhysStart'] ?? 'manual start';
                    _replyPhysStop = data['replyPhysStop'] ?? 'manual stop';
                    _history = List<Map<String, dynamic>>.from(data['history'] ?? []);
                  });
                }
              } catch (_) {}
            }

            Future<void> _saveLocalState() async {
              try {
                final data = {
                  'motorSim': _motorSim,
                  'stickyRate': _stickyRate,
                  'autoMode': _autoMode,
                  'users': _users,
                  'cmdStart': _cmdStart,
                  'replyStart': _replyStart,
                  'cmdStop': _cmdStop,
                  'replyStop': _replyStop,
                  'replyTimerStart': _replyTimerStart,
                  'replyTimerEnd': _replyTimerEnd,
                  'replyPowerCut': _replyPowerCut,
                  'replyPowerResume': _replyPowerResume,
                  'replyPhysStart': _replyPhysStart,
                  'replyPhysStop': _replyPhysStop,
                  'history': _history,
                };
                await _stateFile.writeAsString(jsonEncode(data));
              } catch (_) {}
            }

            void _sendSms(String cmd) async {
              if (_cooldown > 0) {
                _toast('Wait $_cooldown sec (Anti-Spam Lock)');
                return;
              }
              setState(() => _cooldown = 30);
              _cdTimer?.cancel();
              _cdTimer = Timer.periodic(const Duration(seconds: 1), (t) {
                if (_cooldown <= 1) {
                  t.cancel();
                  setState(() => _cooldown = 0);
                } else {
                  setState(() => _cooldown--);
                }
              });
              await platform.invokeMethod('sendSms', {'number': _motorSim, 'message': cmd});
              _toast('SMS Sent: $cmd -> $_motorSim');
            }

            void _handleIncomingSms(String raw) {
              final up = raw.trim().toUpperCase();
              if (up.contains('TCMU-1 USERS') || up.contains('USER1')) {
                final List<String> parsed = ['', '', '', ''];
                for (int i = 1; i <= 4; i++) {
                  final rx = RegExp(r'USER\\s*' + i.toString() + r'\\s*=\\s*(\\d{10,12})', caseSensitive: false);
                  final m = rx.firstMatch(raw);
                  if (m != null) parsed[i - 1] = m.group(1) ?? '';
                }
                setState(() => _users = parsed);
                _saveLocalState();
                _toast('Synced *TCMU-1 USERS* from Device!');
                return;
              }
              if (up.contains(_replyPowerCut.toUpperCase())) {
                setState(() {
                  _motorState = 'PAUSED';
                  _powerState = 'OFF (POWER CUT)';
                });
                _toast('Power Cut! Billing Timer PAUSED.');
                return;
              }
              if (up.contains(_replyPowerResume.toUpperCase())) {
                setState(() {
                  _motorState = 'RUNNING';
                  _powerState = 'AVAILABLE';
                });
                _startClock();
                _toast('Power Resumed! Timer RESUMED.');
                return;
              }
              if (up.contains(_replyPhysStart.toUpperCase())) {
                _beginSession('Physical Start Customer', 'Physical Button Start', 0, sendCmd: false);
                return;
              }
              if (up.contains(_replyPhysStop.toUpperCase()) || up.contains(_replyStop.toUpperCase()) || up.contains(_replyTimerEnd.toUpperCase())) {
                if (_motorState != 'STOPPED') _stopSession(sendCmd: false);
                return;
              }
              if (up.contains(_replyStart.toUpperCase()) || up.contains(_replyTimerStart.toUpperCase())) {
                if (_motorState == 'STOPPED') {
                  _beginSession(_custCtrl.text.isEmpty ? 'Customer' : _custCtrl.text, 'Normal (1*)', 0, sendCmd: false);
                }
              }
            }

            void _beginSession(String cname, String mode, int timerMinutes, {bool sendCmd = true}) {
              final double r = double.tryParse(_rateCtrl.text) ?? _stickyRate;
              _stickyRate = r;
              _saveLocalState();
              setState(() {
                _activeCustomer = cname;
                _activeMode = mode;
                _motorState = 'RUNNING';
                _runSec = 0;
                _cutSec = 0;
                _targetSec = timerMinutes * 60;
              });
              if (sendCmd) {
                if (timerMinutes > 0) {
                  final int x = (timerMinutes / 30).ceil().clamp(1, 47);
                  _sendSms('3*$x');
                } else {
                  _sendSms(_cmdStart);
                }
              }
              _startClock();
            }

            void _startClock() {
              _clock?.cancel();
              _clock = Timer.periodic(const Duration(seconds: 1), (t) {
                setState(() {
                  if (_motorState == 'RUNNING') {
                    _runSec++;
                    if (_targetSec > 0 && _runSec >= _targetSec) {
                      _stopSession(sendCmd: false);
                    }
                  } else if (_motorState == 'PAUSED') {
                    _cutSec++;
                  }
                });
              });
            }

            String _nowDateStr() {
              final dt = DateTime.now();
              return '${dt.day.toString().padLeft(2, "0")}/${dt.month.toString().padLeft(2, "0")}/${dt.year} ${dt.hour.toString().padLeft(2, "0")}:${dt.minute.toString().padLeft(2, "0")}';
            }

            void _stopSession({bool sendCmd = true}) {
              _clock?.cancel();
              if (sendCmd) _sendSms(_cmdStop);
              final double calc = (_runSec / 3600.0) * _stickyRate;
              final double? man = double.tryParse(_manualAmtCtrl.text.trim());
              final double finalBill = man ?? calc;
              final rec = {
                'date': _nowDateStr(),
                'customer': _activeCustomer.isEmpty ? 'Walk-in Customer' : _activeCustomer,
                'mode': _activeMode,
                'runSec': _runSec,
                'cutSec': _cutSec,
                'rate': _stickyRate,
                'bill': finalBill,
                'isManual': man != null,
                'isPaid': true,
              };
              setState(() {
                _motorState = 'STOPPED';
                _history.insert(0, rec);
                _manualAmtCtrl.clear();
              });
              _saveLocalState();
              _toast('Cash Memo Saved: ₹${finalBill.toStringAsFixed(2)}');
            }

            String _hms(int s) {
              final h = (s ~/ 3600).toString().padLeft(2, '0');
              final m = ((s % 3600) ~/ 60).toString().padLeft(2, '0');
              final sec = (s % 60).toString().padLeft(2, '0');
              return '$h:$m:$sec';
            }

            void _toast(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m), duration: const Duration(seconds: 2)));
            }

            @override
            Widget build(BuildContext context) {
              final double? man = double.tryParse(_manualAmtCtrl.text.trim());
              final double liveBill = man ?? ((_runSec / 3600.0) * _stickyRate);

              return Scaffold(
                appBar: AppBar(
                  title: const Text('TCMU-1 Smart Billing'),
                  backgroundColor: const Color(0xFF0F766E),
                  foregroundColor: Colors.white,
                  actions: [
                    IconButton(
                      icon: const Icon(Icons.sync),
                      tooltip: 'Status (5*)',
                      onPressed: () => _sendSms('5*'),
                    ),
                  ],
                ),
                body: IndexedStack(
                  index: _tab,
                  children: [
                    ListView(
                      padding: const EdgeInsets.all(16),
                      children: [
                        Card(
                          elevation: 2,
                          child: Padding(
                            padding: const EdgeInsets.all(16),
                            child: Column(
                              crossAxisAlignment: CrossAxisAlignment.start,
                              children: [
                                Text('PUMP: $_motorState | POWER: $_powerState | SIGNAL: $_signal',
                                    style: const TextStyle(fontWeight: FontWeight.bold)),
                                const SizedBox(height: 8),
                                Text('Running: ${_hms(_runSec)}',
                                    style: const TextStyle(fontSize: 28, fontWeight: FontWeight.bold, color: Color(0xFF0F766E))),
                                Text('Power Cut Minus: ${_hms(_cutSec)}'),
                                const SizedBox(height: 6),
                                Text('CASH MEMO BILL: ₹${liveBill.toStringAsFixed(2)}',
                                    style: const TextStyle(fontSize: 24, fontWeight: FontWeight.bold)),
                              ],
                            ),
                          ),
                        ),
                        const SizedBox(height: 12),
                        TextField(
                          controller: _custCtrl,
                          decoration: const InputDecoration(labelText: 'Customer Name (ग्राहक का नाम)', border: OutlineInputBorder()),
                        ),
                        const SizedBox(height: 10),
                        Row(
                          children: [
                            Expanded(
                              child: TextField(
                                controller: _rateCtrl,
                                keyboardType: TextInputType.number,
                                decoration: const InputDecoration(labelText: 'Sticky Rate ₹/hr', border: OutlineInputBorder()),
                                onChanged: (v) {
                                  final r = double.tryParse(v);
                                  if (r != null && r > 0) {
                                    setState(() => _stickyRate = r);
                                    _saveLocalState();
                                  }
                                },
                              ),
                            ),
                            const SizedBox(width: 10),
                            Expanded(
                              child: TextField(
                                controller: _manualAmtCtrl,
                                keyboardType: TextInputType.number,
                                decoration: const InputDecoration(labelText: 'Manual Fixed ₹ (Optional)', border: OutlineInputBorder()),
                                onChanged: (_) => setState(() {}),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 14),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.green.shade700, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(50)),
                          onPressed: () => _beginSession(_custCtrl.text.isEmpty ? 'Customer' : _custCtrl.text, 'Normal (1*)', 0),
                          child: Text(_cooldown > 0 ? 'LOCKED ($_cooldown s)' : '🟢 NORMAL START (1*)'),
                        ),
                        const SizedBox(height: 10),
                        Row(
                          children: [
                            SizedBox(
                              width: 90,
                              child: TextField(
                                controller: _timerXCtrl,
                                keyboardType: TextInputType.number,
                                decoration: const InputDecoration(labelText: 'X (1=30m)', border: OutlineInputBorder()),
                              ),
                            ),
                            const SizedBox(width: 8),
                            Expanded(
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: Colors.teal.shade700, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(48)),
                                onPressed: () {
                                  final int x = (int.tryParse(_timerXCtrl.text) ?? 2).clamp(1, 47);
                                  _beginSession(_custCtrl.text.isEmpty ? 'Timer Customer' : _custCtrl.text, 'Timer (3*$x)', x * 30);
                                },
                                child: const Text('⏱️ TIMER START (3*X)'),
                              ),
                            ),
                            const SizedBox(width: 8),
                            Expanded(
                              child: ElevatedButton(
                                style: ElevatedButton.styleFrom(backgroundColor: Colors.orange.shade800, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(48)),
                                onPressed: () {
                                  setState(() => _motorState = 'RUNNING');
                                  _startClock();
                                  _sendSms(_cmdStart);
                                },
                                child: const Text('▶️ CONTINUE'),
                              ),
                            ),
                          ],
                        ),
                        const SizedBox(height: 10),
                        ElevatedButton(
                          style: ElevatedButton.styleFrom(backgroundColor: Colors.red.shade700, foregroundColor: Colors.white, minimumSize: const Size.fromHeight(54)),
                          onPressed: () => _stopSession(sendCmd: true),
                          child: const Text('🔴 STOP MOTOR & SAVE CASH MEMO (2*)'),
                        ),
                      ],
                    ),
                    ListView.builder(
                      padding: const EdgeInsets.all(12),
                      itemCount: _history.length,
                      itemBuilder: (ctx, i) {
                        final r = _history[i];
                        final bool paid = r['isPaid'] ?? true;
                        return Card(
                          child: ListTile(
                            title: Text('${r['customer']} — ₹${(r['bill'] as num).toStringAsFixed(2)} (${paid ? "PAID" : "UDHAAR"})'),
                            subtitle: Text('${r['date']} | Run: ${_hms(r['runSec'] ?? 0)} | Rate: ₹${r['rate']}/hr'),
                            trailing: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                TextButton(
                                  onPressed: () {
                                    setState(() => _history[i]['isPaid'] = !paid);
                                    _saveLocalState();
                                  },
                                  child: Text(paid ? 'Udhaar' : 'Paid'),
                                ),
                                IconButton(
                                  icon: const Icon(Icons.share, color: Colors.teal),
                                  onPressed: () {
                                    final memo = '🧾 *CASH MEMO*\\nDate: ${r['date']}\\nCustomer: ${r['customer']}\\nRunning Time: ${_hms(r['runSec'] ?? 0)}\\nRate: ₹${r['rate']}/hr\\n*TOTAL BILL: ₹${(r['bill'] as num).toStringAsFixed(2)}* (${paid ? "PAID" : "UDHAAR"})';
                                    platform.invokeMethod('shareText', {'text': memo});
                                  },
                                ),
                              ],
                            ),
                          ),
                        );
                      },
                    ),
                    ListView(
                      padding: const EdgeInsets.all(16),
                      children: [
                        TextField(
                          controller: _simCtrl,
                          decoration: const InputDecoration(labelText: 'Motor Controller SIM Number', border: OutlineInputBorder()),
                          onChanged: (v) {
                            _motorSim = v.trim();
                            _saveLocalState();
                          },
                        ),
                        SwitchListTile(
                          title: const Text('Auto-Restart on Power Cut (4*1 / 4*0)'),
                          value: _autoMode,
                          onChanged: (v) {
                            setState(() => _autoMode = v);
                            _saveLocalState();
                            _sendSms(v ? '4*1' : '4*0');
                          },
                        ),
                        const Divider(),
                        const Text('*TCMU-1 USERS* (10*, 11*-14*, 16*)', style: TextStyle(fontWeight: FontWeight.bold)),
                        for (int i = 0; i < 4; i++)
                          ListTile(
                            title: Text('USER ${i + 1}: ${_users[i].isEmpty ? "Empty" : _users[i]}'),
                            trailing: Row(
                              mainAxisSize: MainAxisSize.min,
                              children: [
                                TextButton(
                                  onPressed: () => _showAddUserDialog(i + 1),
                                  child: const Text('ADD', style: TextStyle(color: Colors.green)),
                                ),
                                TextButton(
                                  onPressed: () {
